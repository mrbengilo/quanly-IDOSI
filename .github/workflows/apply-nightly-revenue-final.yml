name: Apply and verify nightly revenue cutoff

on:
  push:
    branches: [feat/ops-pages-nightly-revenue-final]
    paths:
      - .github/workflows/apply-nightly-revenue-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ops-pages-nightly-revenue-final
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Prepare clean source and transformation
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin feat/ops-pages-cached-daily-automation
          mkdir -p /tmp/operational_task
          git show origin/feat/ops-pages-cached-daily-automation:scripts/operational_task/group6_revenue_cutoff.py > /tmp/operational_task/group6_revenue_cutoff.py
          git show origin/feat/ops-pages-cached-daily-automation:scripts/operational_task/run_group6_v2.sh > /tmp/operational_task/run_group6_v2.sh
          git reset --hard a05d159ef726c03473be3bc7301dd69592586f07
          cat > /tmp/operational_task/fix_pagination_lint.py <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path, old, new):
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/pages/admin/BusinessSupportSchedulePage.jsx',
              "import { useEffect, useMemo, useState } from 'react'",
              "import { useMemo, useState } from 'react'",
          )
          replace_once(
              'src/pages/admin/BusinessSupportSchedulePage.jsx',
              """  const assignedPageCount = Math.max(1, Math.ceil(filteredSchedules.length / ASSIGNED_SCHEDULE_PAGE_SIZE))
  const pagedSchedules = filteredSchedules.slice(
    assignedPage * ASSIGNED_SCHEDULE_PAGE_SIZE,
    (assignedPage + 1) * ASSIGNED_SCHEDULE_PAGE_SIZE,
  )
  const canDelete = ['admin', 'business_support', 'manager'].includes(app.session?.role)

  useEffect(() => {
    setAssignedPage((current) => Math.min(current, assignedPageCount - 1))
  }, [assignedPageCount])
""",
              """  const assignedPageCount = Math.max(1, Math.ceil(filteredSchedules.length / ASSIGNED_SCHEDULE_PAGE_SIZE))
  const safeAssignedPage = Math.min(assignedPage, assignedPageCount - 1)
  const pagedSchedules = filteredSchedules.slice(
    safeAssignedPage * ASSIGNED_SCHEDULE_PAGE_SIZE,
    (safeAssignedPage + 1) * ASSIGNED_SCHEDULE_PAGE_SIZE,
  )
  const canDelete = ['admin', 'business_support', 'manager'].includes(app.session?.role)
""",
          )
          replace_once(
              'src/pages/admin/BusinessSupportSchedulePage.jsx',
              """          disabled={assignedPage === 0}
          onClick={() => setAssignedPage((current) => Math.max(0, current - 1))}
        >TRƯỚC</Button>
        <span>Trang {assignedPage + 1}/{assignedPageCount} · {filteredSchedules.length} lịch</span>
""",
              """          disabled={safeAssignedPage === 0}
          onClick={() => setAssignedPage(Math.max(0, safeAssignedPage - 1))}
        >TRƯỚC</Button>
        <span>Trang {safeAssignedPage + 1}/{assignedPageCount} · {filteredSchedules.length} lịch</span>
""",
          )
          replace_once(
              'src/pages/admin/BusinessSupportSchedulePage.jsx',
              """          disabled={assignedPage >= assignedPageCount - 1}
          onClick={() => setAssignedPage((current) => Math.min(assignedPageCount - 1, current + 1))}
""",
              """          disabled={safeAssignedPage >= assignedPageCount - 1}
          onClick={() => setAssignedPage(Math.min(assignedPageCount - 1, safeAssignedPage + 1))}
""",
          )

          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              "import { useEffect, useMemo, useState } from 'react'",
              "import { useMemo, useState } from 'react'",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              "import { orderAuditChanges } from './orderAuditUtils'\n",
              "",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              """function OrderAuditChangeList({ record }) {
  const changes = orderAuditChanges(record)
  if (!changes.length) return <span>—</span>
  return <div className="audit-change-list">{changes.map((change) => <div className="audit-change-item" key={change.field}><strong>{change.label}</strong><span><del>{change.before}</del><b aria-hidden="true">→</b><ins>{change.after}</ins></span></div>)}</div>
}

""",
              "",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              """  const selectedDate = auditDates[datePage] || currentDate
""",
              """  const safeDatePage = Math.min(datePage, auditDates.length - 1)
  const selectedDate = auditDates[safeDatePage] || currentDate
""",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              """
  useEffect(() => {
    setDatePage((current) => Math.min(current, auditDates.length - 1))
  }, [auditDates.length])

""",
              "\n",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              """          disabled={datePage === 0}
          onClick={() => setDatePage((current) => Math.max(0, current - 1))}
""",
              """          disabled={safeDatePage === 0}
          onClick={() => setDatePage(Math.max(0, safeDatePage - 1))}
""",
          )
          replace_once(
              'src/pages/admin/GovernancePages.jsx',
              """          disabled={datePage >= auditDates.length - 1}
          onClick={() => setDatePage((current) => Math.min(auditDates.length - 1, current + 1))}
""",
              """          disabled={safeDatePage >= auditDates.length - 1}
          onClick={() => setDatePage(Math.min(auditDates.length - 1, safeDatePage + 1))}
""",
          )

          replace_once(
              'src/pages/admin/SystemFinanceV2.jsx',
              "import { useEffect, useMemo, useState } from 'react'",
              "import { useMemo, useState } from 'react'",
          )
          replace_once(
              'src/pages/admin/SystemFinanceV2.jsx',
              """  const sourceDates = useMemo(() => cashflowSourceDates(sourceSummary.transactions, currentDate), [currentDate, sourceSummary.transactions])
  const sourceDate = sourceDates[sourceDatePage] || currentDate
""",
              """  const sourceDates = useMemo(() => cashflowSourceDates(sourceSummary.transactions, currentDate), [currentDate, sourceSummary.transactions])
  const safeSourceDatePage = Math.min(sourceDatePage, sourceDates.length - 1)
  const sourceDate = sourceDates[safeSourceDatePage] || currentDate
""",
          )
          replace_once(
              'src/pages/admin/SystemFinanceV2.jsx',
              """
  useEffect(() => {
    setSourceDatePage((current) => Math.min(current, sourceDates.length - 1))
  }, [sourceDates.length])

""",
              "\n",
          )
          replace_once(
              'src/pages/admin/SystemFinanceV2.jsx',
              """            disabled={sourceDatePage === 0}
            onClick={() => setSourceDatePage((current) => Math.max(0, current - 1))}
""",
              """            disabled={safeSourceDatePage === 0}
            onClick={() => setSourceDatePage(Math.max(0, safeSourceDatePage - 1))}
""",
          )
          replace_once(
              'src/pages/admin/SystemFinanceV2.jsx',
              """            disabled={sourceDatePage >= sourceDates.length - 1}
            onClick={() => setSourceDatePage((current) => Math.min(sourceDates.length - 1, current + 1))}
""",
              """            disabled={safeSourceDatePage >= sourceDates.length - 1}
            onClick={() => setSourceDatePage(Math.min(sourceDates.length - 1, safeSourceDatePage + 1))}
""",
          )

          replace_once(
              'src/layout/AppShell.notifications.test.jsx',
              "import { StoreOrdersPage } from '../pages/store/StoreV2Pages'\n",
              "",
          )
          PY
          python3 <<'PY'
          from pathlib import Path

          transform = Path('/tmp/operational_task/group6_revenue_cutoff.py')
          text = transform.read_text(encoding='utf-8')
          old = "export const AUTOMATIC_REVENUE_BONUS_EFFECTIVE_DATE = '2026-09-01'\\nexport const AUTOMATIC_REVENUE_BONUS_CUTOFF_HOUR = 22"
          new = "export const AUTOMATIC_REVENUE_BONUS_EFFECTIVE_DATE = '2026-09-03'\\nexport const AUTOMATIC_REVENUE_BONUS_CUTOFF_HOUR = 22"
          if text.count(old) != 1:
              raise RuntimeError(f'cutover transform anchor count={text.count(old)}')
          transform.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('/tmp/operational_task/run_group6_v2.sh')
          text = runner.read_text(encoding='utf-8')
          old_expectation = "new = \"    expect(period.days.map((day) => day.businessDate)).toEqual(['2026-09-01', '2026-09-02'])\\n\""
          original_expectation = "new = \"    expect(period.days.map((day) => day.businessDate)).toEqual([AUTOMATIC_REVENUE_BONUS_EFFECTIVE_DATE])\\n\""
          if text.count(old_expectation) != 1:
              raise RuntimeError(f'period expectation transform count={text.count(old_expectation)}')
          text = text.replace(old_expectation, original_expectation, 1)
          text = text.replace('feat/ops-pages-cached-daily-automation', 'feat/ops-pages-nightly-revenue-final')
          commit_anchor = "git commit -m 'feat(revenue): finalize automatic daily rewards after 22:00'\n"
          insertion = commit_anchor + "\npython /tmp/operational_task/fix_pagination_lint.py\ngit add src/pages/admin/BusinessSupportSchedulePage.jsx src/pages/admin/GovernancePages.jsx src/pages/admin/SystemFinanceV2.jsx src/layout/AppShell.notifications.test.jsx\ngit commit -m 'fix(ui): derive bounded pagination without effects'\n"
          if text.count(commit_anchor) != 1:
              raise RuntimeError(f'runner commit anchor count={text.count(commit_anchor)}')
          text = text.replace(commit_anchor, insertion, 1)
          runner.write_text(text, encoding='utf-8')
          PY
          git config user.name "mrbengilo"
          git config user.email "mrbengilo.76@gmail.com"
          npm ci
      - name: Apply, test and publish clean commit series
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/operational_task/run_group6_v2.sh 2>&1 | tee /tmp/nightly-revenue.log
      - name: Print failure tail
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/nightly-revenue.log ]; then
            echo '===== nightly revenue failure tail ====='
            tail -n 320 /tmp/nightly-revenue.log
          fi
