name: Revenue feature preflight

on:
  push:
    branches: [codex/revenue-three-types-20260914]
    paths: [.github/workflows/revenue-feature-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export exact tracked source for isolated review
        run: |
          mkdir -p /tmp/idosi-review
          git archive --format=tar.gz --output=/tmp/idosi-review/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/idosi-review/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: idosi-revenue-source
          path: /tmp/idosi-review/
          retention-days: 3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export installed test dependencies (no credentials or runtime data)
        run: tar -czf /tmp/idosi-test-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: idosi-revenue-test-dependencies
          path: /tmp/idosi-test-dependencies.tar.gz
          compression-level: 0
          retention-days: 3
      - run: npm run lint
      - run: npm test
      - run: npm run build && npm run sites:verify
