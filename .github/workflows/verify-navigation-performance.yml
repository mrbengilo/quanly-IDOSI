name: Verify IDOSI navigation performance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-navigation-performance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idosi-navigation-performance-verification
  cancel-in-progress: false

jobs:
  verify-production:
    if: github.repository == 'mrbengilo/quanly-IDOSI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://idosi.io.vn
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Wait for the application commit under test
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const expected = process.env.EXPECTED_SHA
          if (!/^[0-9a-f]{40}$/u.test(expected || '')) throw new Error('Missing previous main SHA')
          const deadline = Date.now() + 12 * 60 * 1000
          let last = ''
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`https://idosi.io.vn/api/release?_perf_wait=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' },
              })
              const payload = response.ok ? await response.json() : null
              last = payload?.data?.releaseSha || payload?.releaseSha || `HTTP_${response.status}`
              if (last === expected) {
                console.log(`production_release_sha=${last}`)
                process.exit(0)
              }
            } catch (error) {
              last = String(error)
            }
            console.log(`waiting_for_release expected=${expected} actual=${last}`)
            await new Promise((resolve) => setTimeout(resolve, 10_000))
          }
          throw new Error(`Production did not reach expected release ${expected}; last=${last}`)
          NODE

      - name: Configure production SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          VPS_PORT: ${{ secrets.IDOSI_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.IDOSI_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.IDOSI_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing IDOSI_VPS_HOST}"
          : "${VPS_USER:?Missing IDOSI_VPS_USER}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing IDOSI_VPS_SSH_PRIVATE_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing IDOSI_VPS_KNOWN_HOSTS}"
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPS_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Measure production after navigation fixes
        shell: bash
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' > navigation-performance.txt <<'REMOTE'
          set -Eeuo pipefail
          export LC_ALL=C
          ROOT="${IDOSI_ROOT:-/opt/idosi}"
          COMPOSE_FILE="${IDOSI_COMPOSE_FILE:-$ROOT/deploy/vps/compose.yml}"
          LOCK_FILE="${IDOSI_DEPLOY_LOCK:-/tmp/idosi-production-deploy.lock}"
          exec 9>"$LOCK_FILE"
          flock -n 9 || { echo 'verification_aborted=deployment_or_rollback_active'; exit 1; }
          compose() { docker compose -f "$COMPOSE_FILE" "$@"; }
          section() { printf '\n### %s\n' "$1"; }

          section runtime
          printf 'checked_at=%s\n' "$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%dT%H:%M:%S%z')"
          printf 'vcpus=%s loadavg=%s\n' "$(getconf _NPROCESSORS_ONLN)" "$(tr ' ' ',' </proc/loadavg)"
          free -m
          compose ps
          mapfile -t container_ids < <(compose ps -q --all)
          docker stats --no-stream --format 'container={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} pids={{.PIDs}}' "${container_ids[@]}"
          app_id="$(compose ps -q app)"
          printf 'app_processes=%s\n' "$(docker exec "$app_id" sh -lc "ps -eo comm= | grep -c '^node$' || true")"

          section public_health_samples
          samples="$(mktemp)"
          trap 'rm -f "$samples" "$logs"' EXIT
          for round in $(seq 1 30); do
            curl -sS --max-time 20 -o /dev/null \
              -w '%{time_total}\n' "https://idosi.io.vn/api/health?_navigation_verify=$round" >> "$samples"
          done
          python3 - "$samples" <<'PY'
          import math, statistics, sys
          values = sorted(float(line.strip()) * 1000 for line in open(sys.argv[1]) if line.strip())
          def pct(q):
              rank=(len(values)-1)*q
              lo=math.floor(rank); hi=math.ceil(rank)
              return values[lo] if lo==hi else values[lo]+(values[hi]-values[lo])*(rank-lo)
          print(f'count={len(values)} p50_ms={pct(.50):.1f} p95_ms={pct(.95):.1f} p99_ms={pct(.99):.1f} max_ms={max(values):.1f}')
          if pct(.95) >= 2000 or max(values) >= 5000:
              raise SystemExit(f'public health latency SLO failed: p95={pct(.95):.1f} max={max(values):.1f}')
          PY

          section loopback_burst
          compose exec -T app node <<'NODE'
          const batches = []
          for (let batch = 1; batch <= 4; batch += 1) {
            const started = performance.now()
            const values = await Promise.all(Array.from({ length: 24 }, async (_, index) => {
              const route = index % 2 ? '/api/health' : '/api/release'
              const requestStarted = performance.now()
              const response = await fetch(`http://127.0.0.1:3000${route}?verify=${batch}-${index}`)
              await response.arrayBuffer()
              return performance.now() - requestStarted
            }))
            values.sort((a,b)=>a-b)
            const p95 = values[Math.min(values.length - 1, Math.ceil(values.length * .95) - 1)]
            const result = { batch, total: performance.now()-started, p50: values[Math.floor(values.length*.5)], p95, max: values.at(-1) }
            batches.push(result)
            console.log(`batch=${batch} total_ms=${result.total.toFixed(1)} p50_ms=${result.p50.toFixed(1)} p95_ms=${result.p95.toFixed(1)} max_ms=${result.max.toFixed(1)}`)
          }
          const worst = Math.max(...batches.map((item) => item.p95))
          if (worst >= 2000) throw new Error(`loopback burst p95 SLO failed: ${worst.toFixed(1)}ms`)
          NODE

          section sqlite_configuration
          compose exec -T app node <<'NODE'
          import { DatabaseSync } from 'node:sqlite'
          const path = process.env.IDOSI_DB_PATH || '/app/data/idosi.sqlite'
          const db = new DatabaseSync(path, { readOnly: true })
          db.exec('PRAGMA query_only=ON')
          const value = (name) => Object.values(db.prepare(`PRAGMA ${name}`).get())[0]
          const result = {
            journalMode: String(value('journal_mode')).toLowerCase(),
            cacheSize: Number(value('cache_size')),
            mmapSize: Number(value('mmap_size')),
            busyTimeout: Number(value('busy_timeout')),
            tempStore: Number(value('temp_store')),
          }
          console.log(JSON.stringify(result))
          if (result.journalMode !== 'wal'
            || result.cacheSize > -32768
            || result.mmapSize < 67108864
            || result.busyTimeout < 5000
            || result.tempStore !== 2) {
            throw new Error(`SQLite performance configuration mismatch: ${JSON.stringify(result)}`)
          }
          db.close()
          NODE

          section request_logs_since_20m
          logs="$(mktemp)"
          docker logs --since=20m --tail=100000 "$app_id" > "$logs" 2>&1 || true
          python3 - "$logs" <<'PY'
          import json, math, sys
          from collections import defaultdict
          rows=[]
          for raw in open(sys.argv[1], encoding='utf-8', errors='replace'):
              start=raw.find('{')
              if start<0: continue
              try: value=json.loads(raw[start:])
              except Exception: continue
              if value.get('event')=='idosi.api.request': rows.append(value)
          print(f'api_log_rows={len(rows)}')
          def num(value):
              try: return float(value)
              except Exception: return 0.0
          def pct(values,q):
              values=sorted(num(v) for v in values)
              if not values: return 0.0
              rank=(len(values)-1)*q; lo=math.floor(rank); hi=math.ceil(rank)
              return values[lo] if lo==hi else values[lo]+(values[hi]-values[lo])*(rank-lo)
          groups=defaultdict(list)
          for row in rows: groups[(row.get('method'),row.get('path'))].append(row)
          print('method\tpath\tcount\tge2s\tge5s\tp50_ms\tp95_ms\tmax_ms\tdb_p95_ms\tresponse_p95_kib')
          for (method,path),items in sorted(groups.items(), key=lambda item:(-pct([x.get('durationMs') for x in item[1]],.95),-len(item[1]))):
              durations=[x.get('durationMs') for x in items]
              print('\t'.join([
                  str(method),str(path),str(len(items)),
                  str(sum(num(v)>=2000 for v in durations)),str(sum(num(v)>=5000 for v in durations)),
                  f'{pct(durations,.5):.1f}',f'{pct(durations,.95):.1f}',f'{max(map(num,durations)):.1f}',
                  f"{pct([x.get('database',{}).get('totalMs') for x in items],.95):.1f}",
                  f"{pct([num(x.get('responseBytes'))/1024 for x in items],.95):.1f}",
              ]))
          critical=[row for row in rows if row.get('path') in {
              '/api/system-screens/employee-orders',
              '/api/system-screens/employee-home',
              '/api/account-avatars/:employeeId',
              '/api/store-screens/tasks',
              '/api/store-screens/overview',
              '/api/store-screens/schedule',
          }]
          if critical:
              p95=pct([row.get('durationMs') for row in critical],.95)
              max_ms=max(num(row.get('durationMs')) for row in critical)
              print(f'critical_count={len(critical)} critical_p95_ms={p95:.1f} critical_max_ms={max_ms:.1f}')
              if len(critical)>=5 and (p95>=3000 or max_ms>=7000):
                  raise SystemExit(f'critical endpoint SLO failed: p95={p95:.1f} max={max_ms:.1f}')
          else:
              print('critical_endpoint_sample=insufficient; public and loopback SLOs still verified')
          PY

          section result
          echo 'navigation_performance_verification=PASS'
          REMOTE
          cat navigation-performance.txt

      - name: Upload aggregate performance report
        uses: actions/upload-artifact@v4
        with:
          name: idosi-navigation-performance-report
          path: navigation-performance.txt
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
