name: Diagnose IDOSI navigation latency

on:
  push:
    branches:
      - ops/diagnose-navigation-latency-20260903
    paths:
      - .github/workflows/diagnose-navigation-latency.yml

permissions:
  contents: read

concurrency:
  group: idosi-navigation-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'mrbengilo/quanly-IDOSI' &&
      github.ref == 'refs/heads/ops/diagnose-navigation-latency-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://idosi.io.vn
    env:
      EXPECTED_PRODUCTION_SHA: 34f8923223f22b2f69fe3c3fbfb4c99ddf0392e3
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Verify exact production release before diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const expected = process.env.EXPECTED_PRODUCTION_SHA
          const response = await fetch(`https://idosi.io.vn/api/release?_diagnostic=${Date.now()}`, {
            headers: { 'Cache-Control': 'no-cache' },
          })
          if (!response.ok) throw new Error(`release endpoint returned ${response.status}`)
          const payload = await response.json()
          const actual = payload?.data?.releaseSha || payload?.releaseSha || ''
          if (actual !== expected) throw new Error(`production SHA mismatch: expected ${expected}, got ${actual}`)
          console.log(`production_release_sha=${actual}`)
          NODE

      - name: Configure production SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          VPS_PORT: ${{ secrets.IDOSI_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.IDOSI_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.IDOSI_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing IDOSI_VPS_HOST production secret}"
          : "${VPS_USER:?Missing IDOSI_VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing IDOSI_VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_KNOWN_HOSTS:?Missing IDOSI_VPS_KNOWN_HOSTS production secret}"
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPS_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Measure VPS, API logs and SQLite read footprint
        shell: bash
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export LC_ALL=C
          IDOSI_ROOT="${IDOSI_ROOT:-/opt/idosi}"
          COMPOSE_FILE="${IDOSI_COMPOSE_FILE:-$IDOSI_ROOT/deploy/vps/compose.yml}"
          DEPLOY_LOCK="${IDOSI_DEPLOY_LOCK:-/tmp/idosi-production-deploy.lock}"
          exec 9>"$DEPLOY_LOCK"
          flock -n 9 || { echo 'diagnostic_aborted=deployment_or_rollback_active'; exit 1; }
          compose() { docker compose -f "$COMPOSE_FILE" "$@"; }
          section() { printf '\n### %s\n' "$1"; }

          section runtime_identity
          printf 'checked_at=%s\n' "$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%dT%H:%M:%S%z')"
          printf 'vcpus=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'loadavg=%s\n' "$(tr ' ' ',' </proc/loadavg)"
          free -m
          df -hT / "$IDOSI_ROOT" | awk 'NR == 1 || !seen[$1]++'
          compose ps
          mapfile -t ids < <(compose ps -q --all)
          if (( ${#ids[@]} > 0 )); then
            docker stats --no-stream --format 'container={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} memory_percent={{.MemPerc}} block_io={{.BlockIO}} pids={{.PIDs}}' "${ids[@]}"
          fi

          section public_transport_samples
          for round in 1 2 3 4 5; do
            curl -sS --max-time 20 -o /dev/null \
              -w "round=$round route=/ code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" \
              "https://idosi.io.vn/?_latency_probe=$round"
            curl -sS --max-time 20 -o /dev/null \
              -w "round=$round route=/api/health code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" \
              "https://idosi.io.vn/api/health?_latency_probe=$round"
          done

          section api_request_latency_last_24h
          app_id="$(compose ps -q app)"
          [[ -n "$app_id" ]] || { echo 'app_container=missing'; exit 1; }
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          docker logs --since=24h --tail=100000 "$app_id" >"$log_file" 2>&1 || true
          python3 - "$log_file" <<'PY'
          import json, math, statistics, sys
          from collections import defaultdict

          path = sys.argv[1]
          rows = []
          with open(path, 'r', encoding='utf-8', errors='replace') as handle:
              for raw in handle:
                  raw = raw.strip()
                  if not raw:
                      continue
                  start = raw.find('{')
                  if start < 0:
                      continue
                  try:
                      value = json.loads(raw[start:])
                  except Exception:
                      continue
                  if value.get('event') != 'idosi.api.request':
                      continue
                  rows.append(value)

          print(f'api_log_rows={len(rows)}')
          if not rows:
              raise SystemExit(0)

          def number(value):
              try:
                  result = float(value)
                  return result if math.isfinite(result) else 0.0
              except Exception:
                  return 0.0

          def pct(values, percentile):
              values = sorted(number(value) for value in values)
              if not values:
                  return 0.0
              if len(values) == 1:
                  return values[0]
              rank = (len(values) - 1) * percentile
              low = math.floor(rank)
              high = math.ceil(rank)
              if low == high:
                  return values[low]
              return values[low] + (values[high] - values[low]) * (rank - low)

          groups = defaultdict(list)
          for row in rows:
              groups[(row.get('method', 'GET'), row.get('path', 'unknown'))].append(row)

          print('method\tpath\tcount\tslow_ge_2s\tslow_ge_5s\tp50_ms\tp75_ms\tp95_ms\tp99_ms\tmax_ms\thandler_p95_ms\tdb_p95_ms\tserialize_p95_ms\tresponse_p95_kib\tstatements_p95')
          ranked = sorted(groups.items(), key=lambda item: (-pct([row.get('durationMs') for row in item[1]], .95), -len(item[1]), item[0]))
          for (method, endpoint), items in ranked:
              durations = [row.get('durationMs') for row in items]
              handlers = [row.get('timingMs', {}).get('handler') for row in items]
              db_total = [row.get('database', {}).get('totalMs') for row in items]
              serial = [row.get('timingMs', {}).get('serialize') for row in items]
              response = [number(row.get('responseBytes')) / 1024 for row in items]
              statements = [row.get('database', {}).get('statements') for row in items]
              slow2 = sum(number(value) >= 2000 for value in durations)
              slow5 = sum(number(value) >= 5000 for value in durations)
              print('\t'.join([
                  str(method), str(endpoint), str(len(items)), str(slow2), str(slow5),
                  f'{pct(durations,.50):.1f}', f'{pct(durations,.75):.1f}', f'{pct(durations,.95):.1f}',
                  f'{pct(durations,.99):.1f}', f'{max(map(number,durations)):.1f}',
                  f'{pct(handlers,.95):.1f}', f'{pct(db_total,.95):.1f}', f'{pct(serial,.95):.1f}',
                  f'{pct(response,.95):.1f}', f'{pct(statements,.95):.1f}',
              ]))

          print('\nslowest_requests_without_identity')
          print('timestamp\tmethod\tpath\tstatus\tduration_ms\thandler_ms\tdb_ms\tserialize_ms\tresponse_kib\tstatements\taborted')
          for row in sorted(rows, key=lambda item: number(item.get('durationMs')), reverse=True)[:40]:
              print('\t'.join([
                  str(row.get('timestamp','')), str(row.get('method','')), str(row.get('path','')),
                  str(row.get('status','')), f"{number(row.get('durationMs')):.1f}",
                  f"{number(row.get('timingMs',{}).get('handler')):.1f}",
                  f"{number(row.get('database',{}).get('totalMs')):.1f}",
                  f"{number(row.get('timingMs',{}).get('serialize')):.1f}",
                  f"{number(row.get('responseBytes'))/1024:.1f}",
                  str(row.get('database',{}).get('statements',0)), str(bool(row.get('aborted'))).lower(),
              ]))
          PY

          section sqlite_footprint_and_pragmas
          compose exec -T app node <<'NODE'
          import { statSync } from 'node:fs'
          import { DatabaseSync } from 'node:sqlite'
          const path = process.env.IDOSI_DB_PATH || '/app/data/idosi.sqlite'
          const db = new DatabaseSync(path, { readOnly: true })
          db.exec('PRAGMA query_only=ON')
          const scalar = (sql) => db.prepare(sql).get()
          const pragmas = [
            'journal_mode', 'synchronous', 'cache_size', 'page_size', 'page_count',
            'freelist_count', 'wal_autocheckpoint', 'mmap_size', 'busy_timeout', 'temp_store',
          ]
          console.log(`database_path=${path}`)
          console.log(`database_bytes=${statSync(path).size}`)
          for (const pragma of pragmas) console.log(`pragma_${pragma}=${JSON.stringify(scalar(`PRAGMA ${pragma}`))}`)
          console.log('collection\trows\ttotal_kib\tavg_bytes\tmax_kib\topen_rows')
          const collections = db.prepare(`
            SELECT collection_key,
                   COUNT(*) AS row_count,
                   COALESCE(SUM(value_bytes),0) AS total_bytes,
                   COALESCE(AVG(value_bytes),0) AS avg_bytes,
                   COALESCE(MAX(value_bytes),0) AS max_bytes,
                   SUM(CASE WHEN open_flag = 1 THEN 1 ELSE 0 END) AS open_rows
            FROM state_entities
            WHERE scope_key = 'global'
            GROUP BY collection_key
            ORDER BY total_bytes DESC, row_count DESC
          `).all()
          for (const row of collections) {
            console.log(`${row.collection_key}\t${row.row_count}\t${(Number(row.total_bytes)/1024).toFixed(1)}\t${Number(row.avg_bytes).toFixed(1)}\t${(Number(row.max_bytes)/1024).toFixed(1)}\t${row.open_rows}`)
          }
          console.log('index_list_state_entities=' + JSON.stringify(db.prepare("PRAGMA index_list('state_entities')").all()))
          console.log('app_state_global=' + JSON.stringify(db.prepare(`
            SELECT version, length(value_json) AS inline_bytes, updated_at
            FROM app_state WHERE scope_key='global'
          `).get()))
          db.close()
          NODE

          section app_event_loop_burst
          compose exec -T app node <<'NODE'
          const routes = ['/api/health', '/api/release']
          for (let batch = 1; batch <= 3; batch += 1) {
            const started = performance.now()
            const results = await Promise.all(Array.from({ length: 20 }, async (_, index) => {
              const route = routes[index % routes.length]
              const requestStarted = performance.now()
              const response = await fetch(`http://127.0.0.1:3000${route}?burst=${batch}-${index}`)
              await response.arrayBuffer()
              return performance.now() - requestStarted
            }))
            results.sort((a,b)=>a-b)
            const p95 = results[Math.min(results.length - 1, Math.floor(results.length * .95))]
            console.log(`batch=${batch} count=${results.length} total_ms=${(performance.now()-started).toFixed(1)} p50_ms=${results[Math.floor(results.length*.5)].toFixed(1)} p95_ms=${p95.toFixed(1)} max_ms=${results.at(-1).toFixed(1)}`)
          }
          NODE

          section diagnostic_complete
          echo 'mutations=none data_output=aggregate_only'
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
