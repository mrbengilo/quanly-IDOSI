name: Apply automatic revenue bonus page

on:
  push:
    branches:
      - feat/automatic-live-revenue-bonus
    paths:
      - .github/workflows/apply-automatic-revenue-page.yml

permissions:
  contents: write

env:
  AUTOMATIC_REVENUE_VERIFICATION_REVISION: "6"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/automatic-live-revenue-bonus
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Harden page patcher
        run: python3 scripts/fix-automatic-revenue-page-patcher.py

      - name: Apply automatic revenue page
        run: python3 scripts/apply-automatic-revenue-page.py

      - name: Resolve generated page lint findings
        run: python3 scripts/fix-automatic-revenue-page-output.py

      - name: Apply automatic revenue tests
        run: python3 scripts/apply-automatic-revenue-tests.py

      - name: Update Worker automatic revenue integration test
        run: python3 scripts/update-worker-revenue-automatic-test.py

      - name: Fix generated Worker test binding
        run: python3 scripts/fix-worker-revenue-test-output.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run targeted revenue tests
        run: >-
          npx vitest run
          src/domain/automaticRevenueBonus.test.js
          server/revenueBonusCutoff.test.js
          src/pages/compensation/RevenueBonusCutoff.test.jsx
          src/pages/compensation/RevenueBonusStoreManager.test.jsx
          src/pages/compensation/CompensationPages.test.jsx
          src/services/idosiApi.revenueBonus.test.js
          --maxWorkers=1

      - name: Run Worker automatic revenue integration
        run: >-
          npx vitest run server/worker.test.js
          -t "automatically applies the highest revenue milestone"
          --maxWorkers=1

      - name: Run full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify prepared sites
        run: npm run sites:verify

      - name: Remove temporary implementation files
        run: |
          rm -f .github/workflows/export-source-temp.yml
          rm -f .github/workflows/inspect-auto-revenue.yml
          rm -f .github/workflows/apply-automatic-revenue-page.yml
          rm -f scripts/inspect-auto-revenue-context.py
          rm -f scripts/apply-automatic-revenue-page.py
          rm -f scripts/fix-automatic-revenue-page-patcher.py
          rm -f scripts/fix-automatic-revenue-page-output.py
          rm -f scripts/apply-automatic-revenue-tests.py
          rm -f scripts/update-worker-revenue-automatic-test.py
          rm -f scripts/fix-worker-revenue-test-output.py

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(revenue): automate live daily employee bonuses"
          git push origin HEAD:feat/automatic-live-revenue-bonus
