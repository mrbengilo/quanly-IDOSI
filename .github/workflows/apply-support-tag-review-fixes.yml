name: Apply support tag review fixes

on:
  push:
    branches:
      - feat/systemwide-support-employee-tag-20260901
    paths:
      - .github/workflows/apply-support-tag-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/systemwide-support-employee-tag-20260901
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply review fixes
        run: python3 scripts/apply-support-tag-review-fixes.py

      - name: Check formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Sites build
        run: npm run sites:verify

      - name: Commit verified review fixes
        shell: bash
        run: |
          rm scripts/apply-support-tag-review-fixes.py
          rm .github/workflows/apply-support-tag-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): preserve support tags in payroll snapshots"
          git push origin HEAD:feat/systemwide-support-employee-tag-20260901
