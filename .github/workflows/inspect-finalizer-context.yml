name: Inspect finalizer implementation context

on:
  push:
    branches: [feat/ops-pages-cached-daily-automation]
    paths: [.github/workflows/inspect-finalizer-context.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ops-pages-cached-daily-automation
      - name: Print exact implementation context
        shell: bash
        run: |
          set -Eeuo pipefail
          for range in \
            'server/worker.js:5290:5385' \
            'server/worker.js:20820:21320' \
            'server/worker.js:13370:13680' \
            'server/worker.js:16170:16270' \
            'server/worker.js:23620:23685' \
            'src/state/AppContext.jsx:5740:5865' \
            'src/pages/admin/GovernancePages.jsx:60:245'; do
            IFS=: read -r file start end <<< "$range"
            echo "===== ${file}:${start}-${end} ====="
            sed -n "${start},${end}p" "$file"
          done
