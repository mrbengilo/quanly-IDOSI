name: Inspect finalizer implementation context

on:
  push:
    branches: [feat/ops-pages-cached-daily-automation]
    paths: [.github/workflows/inspect-finalizer-context.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ops-pages-cached-daily-automation
      - name: Print concise implementation locations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== APP CONTEXT ORDER AUDIT LOCATIONS ==='
          grep -nE 'orderAudit|/api/audit|serverTimestamp|actorId' src/state/AppContext.jsx | head -n 80 || true
          echo '=== WORKER REVENUE LOCATIONS ==='
          grep -nE 'getRevenueBonusLive|getRevenueBonusPeriod|finalizeAutomaticRevenue|revenueBonusPeriodCandidates|AUTOMATIC_REVENUE_BONUS_EFFECTIVE_DATE' server/worker.js | head -n 100 || true
          echo '=== WORKER AUDIT LOCATIONS ==='
          grep -nE 'listAudit|audit_log|actor_id|order\.update|order\.delete' server/worker.js | head -n 120 || true
          echo '=== GOVERNANCE ORDER AUDIT LOCATIONS ==='
          grep -nE 'OrderAuditPage|OrderAuditChangeList|orderAuditChanges' src/pages/admin/GovernancePages.jsx | head -n 40 || true
