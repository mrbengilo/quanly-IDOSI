name: Inspect finalizer implementation context

on:
  push:
    branches: [feat/ops-pages-cached-daily-automation]
    paths: [.github/workflows/inspect-finalizer-context.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ops-pages-cached-daily-automation
      - name: Print remaining implementation locations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== SERVER ORDER AUDIT ==='
          grep -nE 'orderAudit|order_audit' server/worker.js | head -n 120 || true
          echo '=== SERVER AUTOMATIC/SCHEDULED REVENUE ==='
          grep -nE 'scheduled\(|cron|automatic.*revenue|revenue.*automatic|FINALIZED|WAITING_SHIFT_CLOSE' server/worker.js wrangler.toml package.json | head -n 180 || true
          echo '=== ORDER MUTATION TAIL ==='
          sed -n '16240,16440p' server/worker.js
          echo '=== SERVER PROJECTION AREAS ==='
          grep -nE "order-audit|audit-history|orderAudit" src/App.jsx server/worker.js | head -n 160 || true
