name: Finalize IDOSI Store Revenue Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.head_ref == 'fix/store-orders-daily-revenue-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Merge latest main
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply requested source changes
        run: python scripts/apply-store-revenue-feature.py

      - name: Install dependencies
        run: npm ci

      - name: Verify final source
        run: |
          npm run lint
          npm test
          npm run build
          npm run sites:verify

      - name: Commit verified implementation
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat(store): sort shift orders and gate daily revenue bonus"
          fi
          git push origin "HEAD:${{ github.head_ref }}"
