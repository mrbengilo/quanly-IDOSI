name: Refresh security lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'ci/dependency-audit-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Generate package-lock security patch
        run: npm audit fix --package-lock-only

      - name: Commit lockfile patch when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the available safe audit fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply safe npm audit lockfile fixes"
          git push origin HEAD:${GITHUB_HEAD_REF}
