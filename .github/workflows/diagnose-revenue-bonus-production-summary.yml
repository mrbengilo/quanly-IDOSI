name: Diagnose Revenue Bonus Production Summary

on:
  push:
    branches:
      - diagnose/revenue-bonus-production-summary-b235
    paths:
      - .github/workflows/diagnose-revenue-bonus-production-summary.yml

permissions:
  contents: read

concurrency:
  group: idosi-production-revenue-summary-b235
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'mrbengilo/quanly-IDOSI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: b235208209791397b67d927b810e22ab1ef786aa
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v6

      - name: Configure production SSH
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          VPS_PORT: ${{ secrets.IDOSI_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.IDOSI_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.IDOSI_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing IDOSI_VPS_HOST production secret}"
          : "${VPS_USER:?Missing IDOSI_VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing IDOSI_VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_KNOWN_HOSTS:?Missing IDOSI_VPS_KNOWN_HOSTS production secret}"
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPS_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Print concise all-store revenue summary
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          audit_end_date="$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' +%F)"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' AUDIT_END_DATE='$audit_end_date' bash -s" \
            < scripts/production-revenue-bonus-summary-remote.sh

      - name: Cleanup SSH
        if: always()
        run: rm -rf "$HOME/.ssh"
