name: Apply data restore employee selector fix

on:
  push:
    branches:
      - fix/data-restore-employee-options

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/data-restore-employee-options
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply reviewed source and regression changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          screen_path = Path('src/domain/workspaceScreens.js')
          screen_text = screen_path.read_text(encoding='utf-8')
          mapping = "  '/admin/data-restore': 'reset',\n"
          if mapping not in screen_text:
              anchor = "  '/admin/reset': 'reset',\n"
              if screen_text.count(anchor) != 1:
                  raise SystemExit('workspaceScreens: reset mapping anchor is missing or ambiguous')
              screen_text = screen_text.replace(anchor, anchor + mapping, 1)
              screen_path.write_text(screen_text, encoding='utf-8')

          test_path = Path('src/App.routes.test.jsx')
          test_text = test_path.read_text(encoding='utf-8')

          data_restore_mock = """vi.mock('./pages/admin/DataRestorePage', () => ({
            DataRestorePage: () => <div>Khôi phục dữ liệu route</div>,
          }))

          """
          if "vi.mock('./pages/admin/DataRestorePage'" not in test_text:
              mock_anchor = "vi.mock('./pages/admin/AdminWorkRegistrationSchedulePage'"
              position = test_text.find(mock_anchor)
              if position < 0:
                  raise SystemExit('App.routes.test: AdminWorkRegistrationSchedulePage mock anchor missing')
              test_text = test_text[:position] + data_restore_mock + test_text[position:]

          projection_test = """  it('loads the reset projection before mounting the Admin data restore workspace', async () => {
            mocked.session = { role: 'admin', name: 'Admin' }
            mocked.remoteDataReady = false
            mocked.remoteProjection = { kind: 'global', storeId: '', screen: 'stores' }
            render(<MemoryRouter initialEntries={['/admin/data-restore']}><CurrentRoute /><App /></MemoryRouter>)

            expect(await screen.findByText('Đang tải dữ liệu chi tiết của hệ thống...')).toBeTruthy()
            expect(mocked.ensureSystemWorkspaceData).toHaveBeenCalledWith({ screen: 'reset' })
            expect(screen.queryByText('Khôi phục dữ liệu route')).toBeNull()
          })

          """
          if "loads the reset projection before mounting the Admin data restore workspace" not in test_text:
              test_anchor = "  it('loads the global projection on demand for a compact Admin detail route'"
              position = test_text.find(test_anchor)
              if position < 0:
                  raise SystemExit('App.routes.test: projection test anchor missing')
              test_text = test_text[:position] + projection_test + test_text[position:]

          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Check generated diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --stat
          grep -F "'/admin/data-restore': 'reset'" src/domain/workspaceScreens.js
          grep -F "loads the reset projection before mounting" src/App.routes.test.jsx

      - name: Install dependencies
        run: npm ci

      - name: Targeted regression tests
        run: npx vitest run src/App.routes.test.jsx

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Sites bundle
        run: npm run sites:verify

      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/apply-data-restore-employee-options.yml
          git config user.name "mrbengilo"
          git config user.email "mrbengilo.76@gmail.com"
          git add -A
          git commit -m "fix(admin): load employee data in restore workspace"
          git push origin HEAD:fix/data-restore-employee-options
