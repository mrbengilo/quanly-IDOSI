name: Apply system-wide support employee tag

on:
  push:
    branches:
      - feat/systemwide-support-employee-tag-20260901
    paths:
      - .github/workflows/apply-systemwide-support-tag.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/systemwide-support-employee-tag-20260901
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Prepare guarded patch against current main
        run: python3 scripts/prepare-systemwide-support-tag.py

      - name: Apply source changes
        run: python3 scripts/apply-systemwide-support-tag.py

      - name: Patch regression expectations
        run: python3 scripts/patch-systemwide-support-tag-tests.py

      - name: Check formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Sites build
        run: npm run sites:verify

      - name: Commit verified feature
        shell: bash
        run: |
          rm scripts/prepare-systemwide-support-tag.py
          rm scripts/apply-systemwide-support-tag.py
          rm scripts/patch-systemwide-support-tag-tests.py
          rm .github/workflows/apply-systemwide-support-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): tag support employees system-wide from Sep 1"
          git push origin HEAD:feat/systemwide-support-employee-tag-20260901
