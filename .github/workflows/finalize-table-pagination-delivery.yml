name: Finalize IDOSI table pagination delivery

on:
  push:
    branches:
      - perf/paginate-data-tables-final-20260904
    paths:
      - .github/workflows/finalize-table-pagination-delivery.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: idosi-table-pagination-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: perf/paginate-data-tables-final-20260904
    steps:
      - name: Checkout pagination branch
        uses: actions/checkout@v6
        with:
          ref: perf/paginate-data-tables-final-20260904
          fetch-depth: 0

      - name: Remove temporary delivery workflow and push clean head
        id: clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mrbengilo'
          git config user.email 'mrbengilo.76@gmail.com'
          rm -f .github/workflows/finalize-table-pagination-delivery.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove pagination delivery helper'
            git push origin HEAD:"$BRANCH"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find or create pull request
        id: pr
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_number="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create --repo "$REPOSITORY" --head "$BRANCH" --base main \
              --title 'perf(ui): phân trang toàn bộ bảng dữ liệu IDOSI' \
              --body-file - <<'BODY'
          ## Mục tiêu
          Giảm số dòng hiển thị và thời gian dựng giao diện của các màn hình có nhiều dữ liệu.

          ## Quy tắc
          - Giao việc Admin: trang 1 gồm hôm nay và hôm qua; ngày cũ hơn ở trang sau.
          - Đơn hàng cửa hàng: trang 1 chỉ ngày hiện tại; ngày cũ hơn ở trang sau.
          - Công việc tính thưởng & vi phạm: trang 1 chỉ ngày hiện tại; ngày cũ hơn ở trang sau.
          - Lịch sử chấm công cửa hàng: trang 1 chỉ ngày hiện tại; ngày cũ hơn ở trang sau.
          - Mọi bảng dữ liệu khác: tối đa 20 dòng mỗi trang.

          ## Kiểm thử
          Targeted pagination tests, lint, full tests, production build và Sites verification đã đạt trước khi mở PR.

          Không thay đổi database hoặc dữ liệu nghiệp vụ.
          BODY
            )"
            pr_number="${pr_url##*/}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=https://github.com/$REPOSITORY/pull/$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for pull request verification
        id: pr_ci
        shell: bash
        env:
          HEAD_SHA: ${{ steps.clean.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            payload="$(gh api "repos/$REPOSITORY/actions/workflows/deploy-pages.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=20")"
            status="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .status // ""' <<<"$payload")"
            conclusion="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .conclusion // ""' <<<"$payload")"
            echo "PR verification attempt $attempt: status=${status:-missing} conclusion=${conclusion:-pending}"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || exit 1
              echo "verify_run_id=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id' <<<"$payload")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for PR verification.' >&2
          exit 1

      - name: Merge verified pull request
        id: merge
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.clean.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title='perf(ui): paginate IDOSI data tables' \
            -f commit_message='Apply date-based first pages to the requested operational screens and cap remaining data tables at 20 visible rows per page.')"
          merged="$(jq -r '.merged' <<<"$result")"
          [[ "$merged" == 'true' ]] || { jq . <<<"$result"; exit 1; }
          merge_sha="$(jq -r '.sha' <<<"$result")"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for main verification
        id: main_ci
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            payload="$(gh api "repos/$REPOSITORY/actions/workflows/deploy-pages.yml/runs?head_sha=$MERGE_SHA&event=push&per_page=20")"
            status="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .status // ""' <<<"$payload")"
            conclusion="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .conclusion // ""' <<<"$payload")"
            echo "Main verification attempt $attempt: status=${status:-missing} conclusion=${conclusion:-pending}"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || exit 1
              run_id="$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id' <<<"$payload")"
              echo "verify_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for main verification.' >&2
          exit 1

      - name: Wait for VPS deployment
        id: deploy
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 240); do
            payload="$(gh api "repos/$REPOSITORY/actions/workflows/deploy-vps.yml/runs?head_sha=$MERGE_SHA&per_page=30")"
            status="$(jq -r '.workflow_runs | map(select(.status != "completed" or .conclusion != "skipped")) | sort_by(.created_at) | last | .status // ""' <<<"$payload")"
            conclusion="$(jq -r '.workflow_runs | map(select(.status != "completed" or .conclusion != "skipped")) | sort_by(.created_at) | last | .conclusion // ""' <<<"$payload")"
            run_id="$(jq -r '.workflow_runs | map(select(.status != "completed" or .conclusion != "skipped")) | sort_by(.created_at) | last | .id // ""' <<<"$payload")"
            echo "Deploy attempt $attempt: run=${run_id:-missing} status=${status:-missing} conclusion=${conclusion:-pending}"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || exit 1
              echo "deploy_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for VPS deployment.' >&2
          exit 1

      - name: Verify exact production release and public health
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const expected = process.env.MERGE_SHA
          const samples = []
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const started = performance.now()
            try {
              const releaseResponse = await fetch(`https://idosi.io.vn/api/release?_pagination_verify=${Date.now()}-${attempt}`, {
                headers: { 'Cache-Control': 'no-cache' },
              })
              const release = await releaseResponse.json()
              const actual = release?.data?.releaseSha || release?.releaseSha || ''
              const healthResponse = await fetch(`https://idosi.io.vn/api/health?_pagination_verify=${Date.now()}-${attempt}`, {
                headers: { 'Cache-Control': 'no-cache' },
              })
              const health = await healthResponse.json()
              samples.push(performance.now() - started)
              if (releaseResponse.ok && healthResponse.ok && actual === expected && (health?.ok || health?.data?.ok)) {
                samples.sort((a, b) => a - b)
                console.log(JSON.stringify({
                  ok: true,
                  expected,
                  actual,
                  health: true,
                  attempts: attempt,
                  lastTotalMs: Number(samples.at(-1).toFixed(1)),
                }))
                process.exit(0)
              }
            } catch (error) {
              console.log(`Production verification attempt ${attempt}: ${error.message}`)
            }
            await new Promise((resolve) => setTimeout(resolve, 5000))
          }
          throw new Error(`Production did not converge to ${expected}`)
          NODE

      - name: Write completion summary
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          PR_VERIFY_RUN: ${{ steps.pr_ci.outputs.verify_run_id }}
          MAIN_VERIFY_RUN: ${{ steps.main_ci.outputs.verify_run_id }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.deploy_run_id }}
        run: |
          {
            echo '## IDOSI table pagination delivery'
            echo
            echo "- Pull request: #${PR_NUMBER:-unknown}"
            echo "- Merge SHA: \`${MERGE_SHA:-unknown}\`"
            echo "- PR Verify run: \`${PR_VERIFY_RUN:-unknown}\`"
            echo "- Main Verify run: \`${MAIN_VERIFY_RUN:-unknown}\`"
            echo "- Deploy run: \`${DEPLOY_RUN:-unknown}\`"
            echo "- Production: https://idosi.io.vn"
            echo "- Final result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
