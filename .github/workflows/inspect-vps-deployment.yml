name: Inspect active IDOSI VPS deployment

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Exact durable deployment operation ID
        required: true
        type: string
      expected_target_sha:
        description: Full target SHA recorded by the operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: idosi-production-observe-${{ inputs.operation_id }}
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'mrbengilo/quanly-IDOSI' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://idosi.io.vn
    steps:
      - name: Checkout inspection script
        uses: actions/checkout@v6

      - name: Validate read-only inspection script
        run: bash -n deploy/vps/inspect-release-job.sh

      - name: Configure production SSH
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          VPS_PORT: ${{ secrets.IDOSI_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.IDOSI_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.IDOSI_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing IDOSI_VPS_HOST production secret}"
          : "${VPS_USER:?Missing IDOSI_VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing IDOSI_VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_KNOWN_HOSTS:?Missing IDOSI_VPS_KNOWN_HOSTS production secret}"
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPS_PORT=${VPS_PORT:-22}" >>"$GITHUB_ENV"

      - name: Inspect exact live deployment operation
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          OPERATION_ID: ${{ inputs.operation_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_target_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9._-]{1,120}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$OPERATION_ID' '$EXPECTED_RELEASE_SHA'" \
            < deploy/vps/inspect-release-job.sh

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
