name: Export pagination source snapshot

on:
  push:
    branches:
      - feat/table-pagination-performance-20260903
    paths:
      - .github/workflows/export-pagination-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/table-pagination-performance-20260903

      - name: Package complete source worktree
        run: |
          set -Eeuo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=pagination-source.tar.gz \
            -czf pagination-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: pagination-source
          path: pagination-source.tar.gz
          if-no-files-found: error
          retention-days: 1
