name: Apply open-attendance transfer precedence

on:
  push:
    branches:
      - fix/open-attendance-precedes-transfer
    paths:
      - .github/workflows/apply-open-attendance-transfer-precedence.yml

permissions:
  contents: write

concurrency:
  group: apply-open-attendance-transfer-precedence
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/open-attendance-precedes-transfer
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Validate reviewed source anchors
        run: python3 .github/open-attendance-transfer-precedence/apply.py --root . --check

      - name: Apply source changes
        run: python3 .github/open-attendance-transfer-precedence/apply.py --root . --write

      - name: Preserve login across legacy attendance collisions
        run: python3 .github/open-attendance-transfer-precedence/normalize_collision.py

      - name: Check generated diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Targeted transfer precedence regression
        run: >-
          npm test -- server/worker.test.js
          -t "does not complete an active transfer when closing a pre-existing home attendance"

      - name: Targeted attendance collision regression
        run: >-
          npm test -- server/worker.test.js
          -t "targets the exact attendance id and rejects ambiguous folded ids across employee mutations"

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Sites bundle
        run: npm run sites:verify

      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/open-attendance-transfer-precedence
          rm -f .github/workflows/apply-open-attendance-transfer-precedence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(attendance): keep the current store until checkout"
          git push origin HEAD:fix/open-attendance-precedes-transfer
