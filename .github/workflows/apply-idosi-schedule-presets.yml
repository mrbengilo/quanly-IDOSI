name: Apply IDOSI schedule preset patch

# Retry after aligning source anchors, page imports, and exact regression expectations.
on:
  push:
    branches:
      - feat/support-schedule-presets
    paths:
      - .github/workflows/apply-idosi-schedule-presets.yml

permissions:
  contents: write

concurrency:
  group: apply-idosi-schedule-presets
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/support-schedule-presets
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild reviewed patch script
        shell: bash
        run: |
          cat .github/idosi-schedule-presets/patch.part.* > .github/idosi-schedule-presets/apply_idosi_schedule_preset_update.py
          python -m py_compile .github/idosi-schedule-presets/apply_idosi_schedule_preset_update.py

      - name: Validate source anchors
        run: python .github/idosi-schedule-presets/apply_idosi_schedule_preset_update.py --root . --check

      - name: Apply source update
        run: python .github/idosi-schedule-presets/apply_idosi_schedule_preset_update.py --root . --write

      - name: Apply reviewed follow-up fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # The new configuration panel calls the shared domain validator.
          page_path = Path('src/pages/admin/BusinessSupportSchedulePage.jsx')
          page_text = page_path.read_text(encoding='utf-8')
          old_import = "  canConfigureSupportSchedulePresets,\n  normalizeSupportSchedulePresets,\n  supportScheduleDays,"
          new_import = "  canConfigureSupportSchedulePresets,\n  normalizeSupportSchedulePresets,\n  supportScheduleDays,\n  validateSupportSchedulePresets,"
          if page_text.count(old_import) != 1:
              raise SystemExit('schedule-page validation import anchor missing')
          page_path.write_text(page_text.replace(old_import, new_import, 1), encoding='utf-8')

          # Required Field labels include the visual asterisk in their accessible name.
          page_test_path = Path('src/pages/admin/BusinessSupportSchedulePage.test.jsx')
          page_test = page_test_path.read_text(encoding='utf-8')
          exact_start = "screen.getByLabelText(/^Giờ bắt đầu$/u)"
          if page_test.count(exact_start) != 2:
              raise SystemExit(f'unexpected start-label query count: {page_test.count(exact_start)}')
          page_test = page_test.replace(exact_start, "screen.getByLabelText(/Giờ bắt đầu/u)")
          exact_end = "screen.getByLabelText(/^Giờ kết thúc$/u)"
          if page_test.count(exact_end) != 1:
              raise SystemExit(f'unexpected end-label query count: {page_test.count(exact_end)}')
          page_test = page_test.replace(exact_end, "screen.getByLabelText(/Giờ kết thúc/u)")
          page_test_path.write_text(page_test, encoding='utf-8')

          # The compact bootstrap contract now intentionally exposes the shared
          # preset collection to HTKD and Office employees.
          worker_test_path = Path('server/worker.test.js')
          worker_test = worker_test_path.read_text(encoding='utf-8')
          support_marker = "expect(loginBodies.support.bootstrap.loadedCollections).toEqual(["
          support_start = worker_test.index(support_marker)
          support_end = worker_test.index('])', support_start) + 2
          support_block = worker_test[support_start:support_end]
          support_old = "...sessionContextCollections, 'attendance', 'supportWorkSchedules',\n"
          support_new = "...sessionContextCollections, 'attendance', 'supportWorkSchedules', 'supportSchedulePresets',\n"
          if support_block.count(support_old) != 1:
              raise SystemExit('support bootstrap expectation anchor missing')
          support_block = support_block.replace(support_old, support_new, 1)
          worker_test = worker_test[:support_start] + support_block + worker_test[support_end:]

          office_marker = "expect(loginBodies.officeEmployee.bootstrap.loadedCollections).toEqual(["
          office_start = worker_test.index(office_marker)
          office_end = worker_test.index('])', office_start) + 2
          office_block = worker_test[office_start:office_end]
          office_old = "...sessionContextCollections, 'attendance', 'supportWorkSchedules',\n"
          office_new = "...sessionContextCollections, 'attendance', 'supportWorkSchedules', 'supportSchedulePresets',\n"
          if office_block.count(office_old) != 1:
              raise SystemExit('office bootstrap expectation anchor missing')
          office_block = office_block.replace(office_old, office_new, 1)
          worker_test = worker_test[:office_start] + office_block + worker_test[office_end:]
          worker_test_path.write_text(worker_test, encoding='utf-8')
          PY

      - name: Check generated diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit tested source changes
        shell: bash
        run: |
          rm -rf .github/idosi-schedule-presets
          rm -f .github/workflows/apply-idosi-schedule-presets.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(schedule): configure shared quick time presets"
          git push origin HEAD:feat/support-schedule-presets
