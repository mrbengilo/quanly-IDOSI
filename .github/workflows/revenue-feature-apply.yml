name: Revenue feature delivery verification

on:
  push:
    branches: [codex/revenue-three-types-20260914]
    paths: [.github/workflows/revenue-feature-apply.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/revenue-three-types-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.delivery.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply hash-verified atomic feature commits to feature branch only
        id: delivery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          parts=''.join((root/f'.github/idosi-revenue/part{i}.b64').read_text().strip() for i in (1,2,3))
          raw=lzma.decompress(base64.b64decode(parts,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='d98a7b0aac73c2af22e612bbd55ae2e05e147dc114cebb2e31ca83969fe8a13b','Delivery checksum mismatch'
          tasks=json.loads(raw)
          assert len(tasks)==6
          for task in tasks:
              paths=[]
              for change in task['changes']:
                  relative=pathlib.PurePosixPath(change['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.parts[0] in ('src','server','docs')
                  path=root/relative
                  old=path.read_text() if path.exists() else ''
                  assert hashlib.sha256(old.encode()).hexdigest()==change['before'],f'Stale source: {relative}'
                  for offset,count,text in reversed(change['ops']):
                      assert 0<=offset<=len(old) and 0<=count<=len(old)-offset
                      old=old[:offset]+text+old[offset+count:]
                  assert hashlib.sha256(old.encode()).hexdigest()==change['after'],f'Result mismatch: {relative}'
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(old)
                  paths.append(str(relative))
              subprocess.run(['git','diff','--check'],check=True)
              subprocess.run(['git','add','--',*paths],check=True)
              subprocess.run(['git','commit','-m',task['message']],check=True)
          PY
          git push origin HEAD:refs/heads/codex/revenue-three-types-20260914
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -6 --format='%H %s'
  gate:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apply.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: mkdir -p "$RUNNER_TEMP/revenue-evidence" && git log -6 --format='%H %s' > "$RUNNER_TEMP/revenue-evidence/commits.txt"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/revenue-evidence/lint.log"
      - name: Full regression tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/revenue-evidence/tests.log"
      - name: Production build and original bundle limits
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/revenue-evidence/build.log"
      - name: Sites compatibility
        run: npm run sites:verify 2>&1 | tee "$RUNNER_TEMP/revenue-evidence/sites.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-gate-evidence
          path: ${{ runner.temp }}/revenue-evidence
          retention-days: 7
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apply.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Install isolated browser test runner
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/browser-env/bin/python" -m playwright install --with-deps chromium
      - name: Browser controls, real API, persistence and store warehouse agreement
        run: |
          mkdir -p "$RUNNER_TEMP/revenue-evidence"
          NODE_ENV=test node .github/idosi-revenue/browser-fixture.mjs > "$RUNNER_TEMP/revenue-evidence/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if grep -q BROWSER_FIXTURE_READY "$RUNNER_TEMP/revenue-evidence/fixture.log"; then ready=1; break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/revenue-evidence/fixture.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          "$RUNNER_TEMP/browser-env/bin/python" .github/idosi-revenue/browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-browser-evidence
          path: ${{ runner.temp }}/revenue-evidence
          retention-days: 7
