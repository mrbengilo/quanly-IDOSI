name: Verify IDOSI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-idosi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: idosi-ci-${{ github.run_id }}-${{ github.run_attempt }}
  IDOSI_IMAGE: idosi-app:${{ github.sha }}
  IDOSI_RELEASE_SHA: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit production dependencies
        run: node scripts/audit-npm-bulk.mjs --omit=dev --audit-level=high

      - name: Report full dependency audit
        continue-on-error: true
        run: node scripts/audit-npm-bulk.mjs --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Sites build
        run: npm run sites:verify

      - name: Validate VPS deployment scripts
        run: |
          bash -n deploy/vps/deploy-release.sh
          bash -n deploy/vps/rollback-release.sh
          bash -n deploy/vps/run-release-job.sh
          bash -n deploy/vps/finalize-release.sh
          bash deploy/vps/release-workflow.test.sh
          node scripts/verify-vps-auto-deploy.mjs
          node --check server/vps/release-info.mjs
          node --check server/vps/verify-release.mjs
          node --check server/vps/static-release.mjs
          node --check server/vps/verify-public-release.mjs

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e IDOSI_RELEASE_SHA \
            --mount "type=bind,source=$PWD/deploy/vps/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            --entrypoint caddy caddy:2.10-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate VPS Compose configuration
        run: |
          cp deploy/vps/.env.example deploy/vps/.env
          docker compose -f deploy/vps/compose.yml config --quiet

      - name: Build VPS release image
        run: |
          docker compose -f deploy/vps/compose.yml build app
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IDOSI_IMAGE")"
          [[ "$image_revision" == "$IDOSI_RELEASE_SHA" ]]
          static_topology="$(docker image inspect --format '{{ index .Config.Labels "io.idosi.static-topology" }}' "$IDOSI_IMAGE")"
          [[ "$static_topology" == 'sha-volume-v1' ]]

      - name: Verify immutable static release volume
        run: |
          static_volume="idosi_static_$IDOSI_RELEASE_SHA"
          docker volume create \
            --label 'io.idosi.managed=true' \
            --label "io.idosi.release-sha=$IDOSI_RELEASE_SHA" \
            "$static_volume" >/dev/null
          docker run --rm --network none --read-only --user 0:0 \
            --mount "type=volume,source=$static_volume,target=/static" \
            --entrypoint node "$IDOSI_IMAGE" server/vps/static-release.mjs prepare \
            --source /app/dist/client --target /static --sha "$IDOSI_RELEASE_SHA"
          docker run --rm --network none --read-only \
            --mount "type=volume,source=$static_volume,target=/static,readonly" \
            --entrypoint node "$IDOSI_IMAGE" server/vps/static-release.mjs verify \
            --target /static --sha "$IDOSI_RELEASE_SHA"

      - name: Verify VPS runtime and exact release identity
        run: |
          docker compose -f deploy/vps/compose.yml up -d --no-build app
          for attempt in {1..18}; do
            if docker compose -f deploy/vps/compose.yml exec -T app \
              node server/vps/verify-release.mjs http://127.0.0.1:3000 "$IDOSI_RELEASE_SHA"; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f deploy/vps/compose.yml logs --tail=300 app
          exit 1

      - name: Clean VPS verification stack
        if: always()
        run: |
          docker compose -f deploy/vps/compose.yml down -v --remove-orphans
          docker volume rm "idosi_static_$IDOSI_RELEASE_SHA" >/dev/null 2>&1 || true
