name: Deploy IDOSI VPS

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character merge commit SHA from main
        required: true
        type: string
  workflow_run:
    workflows:
      - Verify IDOSI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: idosi-production
  cancel-in-progress: false

jobs:
  release-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      trigger_mode: ${{ steps.release.outputs.trigger_mode }}
      verify_run_id: ${{ steps.release.outputs.verify_run_id }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release SHA
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
          VERIFIED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_EVENT: ${{ github.event.workflow_run.event }}
          VERIFIED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail

          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
                echo 'Run a manual production deployment from the main branch only.' >&2
                exit 1
              }
              release_sha="${MANUAL_RELEASE_SHA,,}"
              trigger_mode='manual'
              verify_run_id='manual-gate-query'
              ;;
            workflow_run)
              [[ "$VERIFIED_CONCLUSION" == 'success' ]] || {
                echo 'The triggering Verify IDOSI run did not succeed.' >&2
                exit 1
              }
              [[ "$VERIFIED_EVENT" == 'push' && "$VERIFIED_BRANCH" == 'main' ]] || {
                echo 'Automatic production deployment only accepts a successful push/main Verify IDOSI run.' >&2
                exit 1
              }
              release_sha="${VERIFIED_RELEASE_SHA,,}"
              trigger_mode='automatic'
              verify_run_id="$VERIFIED_RUN_ID"
              ;;
            *)
              echo "Unsupported deployment event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_sha must be a complete 40-character commit SHA.' >&2
            exit 1
          }

          git fetch --prune origin main
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo 'The requested release is not in origin/main history.' >&2
            exit 1
          }

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"
          echo "verify_run_id=$verify_run_id" >> "$GITHUB_OUTPUT"

      - name: Require successful Verify IDOSI run for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f status=completed \
            -f per_page=100)"
          jq -e '.workflow_runs | any(.conclusion == "success" and .event == "push" and .head_branch == "main")' <<<"$runs" >/dev/null || {
            echo "Verify IDOSI has not passed for $RELEASE_SHA." >&2
            exit 1
          }

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: https://idosi.io.vn
    steps:
      - name: Checkout exact verified release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-gate.outputs.release_sha }}
          fetch-depth: 1

      - name: Setup Node.js for external verification
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Configure production SSH
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
          VPS_PORT: ${{ secrets.IDOSI_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.IDOSI_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.IDOSI_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing IDOSI_VPS_HOST production secret}"
          : "${VPS_USER:?Missing IDOSI_VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing IDOSI_VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_KNOWN_HOSTS:?Missing IDOSI_VPS_KNOWN_HOSTS production secret}"
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]] || {
            echo 'IDOSI_VPS_PORT must be numeric.' >&2
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPS_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"
          echo "REMOTE_DEPLOY_SCRIPT=/tmp/idosi-deploy-$RELEASE_SHA.sh" >> "$GITHUB_ENV"
          echo "REMOTE_RUNNER_SCRIPT=/tmp/idosi-run-job-$RELEASE_SHA.sh" >> "$GITHUB_ENV"
          echo "REMOTE_FINALIZER_SCRIPT=/tmp/idosi-finalize-$RELEASE_SHA.sh" >> "$GITHUB_ENV"

      - name: Upload exact durable deployment helpers
        env:
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps/deploy-release.sh "$VPS_USER@$VPS_HOST:$REMOTE_DEPLOY_SCRIPT"
          scp -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps/run-release-job.sh "$VPS_USER@$VPS_HOST:$REMOTE_RUNNER_SCRIPT"
          scp -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps/finalize-release.sh "$VPS_USER@$VPS_HOST:$REMOTE_FINALIZER_SCRIPT"

      - name: Start durable deployment on VPS
        id: durable
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          operation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SHA:0:12}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 700 '$REMOTE_DEPLOY_SCRIPT' '$REMOTE_RUNNER_SCRIPT' '$REMOTE_FINALIZER_SCRIPT' && bash '$REMOTE_RUNNER_SCRIPT' '$RELEASE_SHA' '$operation_id' '$REMOTE_DEPLOY_SCRIPT'"
          echo "operation_id=$operation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for durable deployment completion
        env:
          OPERATION_ID: ${{ steps.durable.outputs.operation_id }}
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          status_file="/opt/idosi/deploy/vps/backups/jobs/$OPERATION_ID.status"
          ssh_args=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          for attempt in $(seq 1 360); do
            status="$(ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
              "if [ -f '$status_file' ]; then cat '$status_file'; fi" 2>/dev/null || true)"
            state="$(sed -n 's/^STATE=//p' <<<"$status" | head -n 1)"
            if [[ "$state" == 'COMPLETED' ]]; then
              exit_code="$(sed -n 's/^EXIT_CODE=//p' <<<"$status" | head -n 1)"
              log_file="$(sed -n 's/^LOG_FILE=//p' <<<"$status" | head -n 1)"
              [[ "$exit_code" =~ ^[0-9]+$ ]] || {
                echo 'Durable deployment completed without a valid exit code.' >&2
                exit 1
              }
              if [[ "$exit_code" != '0' ]]; then
                echo "Remote deployment failed with exit code $exit_code." >&2
                if [[ -n "$log_file" ]]; then
                  ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "tail -n 300 '$log_file'" >&2 || true
                fi
                exit "$exit_code"
              fi
              if [[ -n "$log_file" ]]; then
                ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "tail -n 120 '$log_file'" || true
              fi
              exit 0
            fi
            sleep 15
          done

          echo 'GitHub polling window expired; the detached VPS deployment was not killed and may still be running.' >&2
          status="$(ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
            "if [ -f '$status_file' ]; then cat '$status_file'; fi" 2>/dev/null || true)"
          log_file="$(sed -n 's/^LOG_FILE=//p' <<<"$status" | head -n 1)"
          if [[ -n "$log_file" ]]; then
            ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "tail -n 300 '$log_file'" >&2 || true
          fi
          exit 1

      - name: Verify public production release
        id: external_verification
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          node server/vps/verify-public-release.mjs https://idosi.io.vn "$RELEASE_SHA"
          echo 'verified_origin=https://idosi.io.vn' >> "$GITHUB_OUTPUT"
          echo "verified_at=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "verified_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Finalize deployment report after external verification
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          EXTERNAL_VERIFIED_AT_UTC: ${{ steps.external_verification.outputs.verified_at }}
          EXTERNAL_VERIFIED_ORIGIN: ${{ steps.external_verification.outputs.verified_origin }}
          EXTERNAL_VERIFIED_SHA: ${{ steps.external_verification.outputs.verified_sha }}
          EXTERNAL_VERIFY_RUN_ID: ${{ github.run_id }}
          EXTERNAL_VERIFY_RUN_ATTEMPT: ${{ github.run_attempt }}
          VPS_HOST: ${{ secrets.IDOSI_VPS_HOST }}
          VPS_USER: ${{ secrets.IDOSI_VPS_USER }}
        run: |
          set -Eeuo pipefail
          : "${EXTERNAL_VERIFIED_AT_UTC:?Missing external verification attestation}"
          : "${EXTERNAL_VERIFIED_ORIGIN:?Missing externally verified origin}"
          : "${EXTERNAL_VERIFIED_SHA:?Missing externally verified release SHA}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash '$REMOTE_FINALIZER_SCRIPT' '$RELEASE_SHA' '$EXTERNAL_VERIFIED_AT_UTC' '$EXTERNAL_VERIFIED_ORIGIN' '$EXTERNAL_VERIFY_RUN_ID' '$EXTERNAL_VERIFY_RUN_ATTEMPT' '$EXTERNAL_VERIFIED_SHA' && rm -f '$REMOTE_DEPLOY_SCRIPT' '$REMOTE_RUNNER_SCRIPT' '$REMOTE_FINALIZER_SCRIPT'"

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"

      - name: Write deployment summary
        if: always()
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          TRIGGER_MODE: ${{ needs.release-gate.outputs.trigger_mode }}
          VERIFY_RUN_ID: ${{ needs.release-gate.outputs.verify_run_id }}
          OPERATION_ID: ${{ steps.durable.outputs.operation_id }}
        run: |
          {
            echo '## IDOSI production deployment'
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Trigger: \`${TRIGGER_MODE:-unknown}\`"
            echo "- Verify workflow run: \`${VERIFY_RUN_ID:-unknown}\`"
            echo "- Operation ID: \`${OPERATION_ID:-not-started}\`"
            echo "- Environment: \`production\`"
            echo "- Public URL: https://idosi.io.vn"
            echo "- Workflow result: \`${{ job.status }}\`"
            echo '- Remote deployment is detached; runner disconnect/timeout does not terminate the VPS critical section.'
            echo '- Deployment report becomes `SUCCESS` only after external verification and remote finalization pass.'
          } >> "$GITHUB_STEP_SUMMARY"
