name: Apply employee active-shift fixes

on:
  push:
    branches:
      - fix/employee-active-shift-context
    paths:
      - .github/workflows/apply-employee-active-shift-context.yml

permissions:
  contents: write

concurrency:
  group: apply-employee-active-shift-context
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/employee-active-shift-context
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Validate reviewed source anchors
        run: python3 .github/employee-active-shift-context/apply.py --root . --check

      - name: Apply source changes
        run: python3 .github/employee-active-shift-context/apply.py --root . --write

      - name: Check generated diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Targeted regression tests
        run: npm test -- src/pages/employee/EmployeeActiveShiftContext.test.jsx src/pages/employee/EmployeeShiftOperations.test.jsx

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Sites bundle
        run: npm run sites:verify

      - name: Commit verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/employee-active-shift-context
          rm -f .github/workflows/apply-employee-active-shift-context.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(employee): scope work to the open attendance"
          git push origin HEAD:fix/employee-active-shift-context
