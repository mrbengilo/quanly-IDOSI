name: Verify pagination production assets

on:
  push:
    branches:
      - verify/pagination-production-86a28d3f
    paths:
      - .github/workflows/verify-pagination-production.yml

permissions:
  contents: read

concurrency:
  group: verify-pagination-production-86a28d3f
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: 86a28d3fe9c4e946bd47f618e97c2f0288ecf97f
      BASE_URL: https://idosi.io.vn
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v6

      - name: Verify exact public release and pagination assets
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const baseUrl = process.env.BASE_URL
          const expected = process.env.EXPECTED_RELEASE_SHA
          const headers = { 'Cache-Control': 'no-cache', Pragma: 'no-cache' }
          const fetchText = async (path) => {
            const url = new URL(path, baseUrl)
            url.searchParams.set('_pagination_verify', `${expected}-${Date.now()}`)
            const response = await fetch(url, { headers })
            if (!response.ok) throw new Error(`${url} returned ${response.status}`)
            return response.text()
          }

          const releaseResponse = await fetch(`${baseUrl}/api/release?_pagination_verify=${Date.now()}`, { headers })
          if (!releaseResponse.ok) throw new Error(`release endpoint returned ${releaseResponse.status}`)
          const release = await releaseResponse.json()
          const actual = String(release?.data?.releaseSha || release?.releaseSha || '')
          if (actual !== expected) throw new Error(`release SHA mismatch: expected ${expected}, got ${actual}`)

          const html = await fetchText('/')
          const cssPaths = [...html.matchAll(/href=["']([^"']+\.css(?:\?[^"']*)?)["']/gu)].map((match) => match[1])
          if (!cssPaths.length) throw new Error('No production CSS assets were discovered')
          const css = (await Promise.all(cssPaths.map(fetchText))).join('\n')
          for (const marker of ['.pagination__ellipsis', '.table-footer>span strong']) {
            if (!css.includes(marker)) throw new Error(`Production CSS is missing pagination marker ${marker}`)
          }

          const expectedChunks = [
            '/assets/UI-Ce1XHR-f.js',
            '/assets/SupportWorkPages-CuCR6mbe.js',
            '/assets/AdminWorkRegistrationSchedulePage-CbGIw6Jc.js',
            '/assets/ViolationManagementPage-Bwy41xI6.js',
            '/assets/StoreV2Pages-BZlGt1sC.js',
          ]
          const chunks = await Promise.all(expectedChunks.map(async (path) => ({ path, body: await fetchText(path) })))
          const ui = chunks.find((chunk) => chunk.path.includes('/UI-'))?.body || ''
          for (const marker of ['Phân trang bảng dữ liệu', 'Trang trước', 'Trang sau']) {
            if (!ui.includes(marker)) throw new Error(`Production UI chunk is missing pagination marker: ${marker}`)
          }

          const support = chunks.find((chunk) => chunk.path.includes('SupportWorkPages'))?.body || ''
          if (!support.includes('Lịch sử giao việc và tiến độ hoàn thành')) {
            throw new Error('Production support-work chunk does not match the expected paginated screen')
          }

          const violation = chunks.find((chunk) => chunk.path.includes('ViolationManagementPage'))?.body || ''
          if (!violation.includes('Lịch sử vi phạm')) {
            throw new Error('Production violation chunk does not match the expected paginated screen')
          }

          const store = chunks.find((chunk) => chunk.path.includes('StoreV2Pages'))?.body || ''
          for (const marker of ['Lịch sử chấm công của nhân viên', 'ĐƠN HÀNG']) {
            if (!store.includes(marker)) throw new Error(`Production store chunk is missing screen marker: ${marker}`)
          }

          console.log(JSON.stringify({
            ok: true,
            releaseSha: actual,
            cssAssetsChecked: cssPaths.length,
            javascriptAssetsChecked: expectedChunks,
            paginationMarkers: ['pagination__ellipsis', 'Phân trang bảng dữ liệu', 'Trang trước', 'Trang sau'],
            screenMarkers: ['Lịch sử giao việc và tiến độ hoàn thành', 'Lịch sử vi phạm', 'Lịch sử chấm công của nhân viên', 'ĐƠN HÀNG'],
          }))
          NODE
