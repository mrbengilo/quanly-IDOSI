name: Apply support bonus and payroll tag

on:
  push:
    branches:
      - fix/store-support-bonus-payroll-tag
    paths:
      - .github/workflows/apply-support-bonus-payroll-tag.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/store-support-bonus-payroll-tag
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded source patch
        run: python3 scripts/apply-support-bonus-payroll-tag.py

      - name: Check formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify sites build
        run: npm run sites:verify

      - name: Commit verified changes
        shell: bash
        run: |
          rm scripts/apply-support-bonus-payroll-tag.py
          rm .github/workflows/apply-support-bonus-payroll-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(store): exclude support bonus and label payroll rows"
          git push origin HEAD:fix/store-support-bonus-payroll-tag
