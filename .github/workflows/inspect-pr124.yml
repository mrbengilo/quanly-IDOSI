name: Inspect PR 124 internals

on:
  push:
    branches:
      - feat/automatic-live-revenue-bonus
    paths:
      - .github/workflows/inspect-pr124.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-live-revenue-bonus
      - name: Inspect exact integration blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/worker.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          for needle, before, after in [
              ('const getRevenueBonusLive =', 5, 80),
              ("if (path === '/api/revenue-bonus/live')", 5, 20),
              ("revenueBonusAllocations: filterArray(state, 'revenueBonusAllocations'", 10, 30),
              ("revenueBonusAllocations: own('revenueBonusAllocations')", 10, 25),
              ('const automaticRevenueBonusPeriodFor =', 5, 55),
              ('export const revenueBonusLiveSnapshot =', 5, 55),
          ]:
              matches = [index for index, line in enumerate(lines) if needle in line]
              print(f'===== {needle!r}: {matches} =====')
              for index in matches:
                  start = max(0, index - before)
                  end = min(len(lines), index + after + 1)
                  for line_number in range(start, end):
                      print(f'{line_number + 1:06d}: {lines[line_number]}')
          PY
