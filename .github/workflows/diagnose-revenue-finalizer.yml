name: Diagnose revenue finalizer architecture

on:
  push:
    branches:
      - feat/ops-pages-cached-daily-automation
    paths:
      - .github/workflows/diagnose-revenue-finalizer.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ops-pages-cached-daily-automation
          fetch-depth: 0

      - name: Print focused server architecture snippets
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def snippets(path, terms, radius=1400):
              text = Path(path).read_text(encoding='utf-8')
              print(f'\n===== FILE {path} chars={len(text)} lines={text.count(chr(10))+1} =====')
              for term in terms:
                  positions = [m.start() for m in re.finditer(re.escape(term), text)]
                  print(f'\n--- TERM {term!r}: {len(positions)} occurrence(s) ---')
                  for index, pos in enumerate(positions[:12], 1):
                      start = max(0, pos - radius)
                      end = min(len(text), pos + len(term) + radius)
                      print(f'\n[{index}] chars {start}:{end}\n{text[start:end]}')

          snippets('server/worker.js', [
              'revenueBonusLiveSnapshot',
              'automaticRevenueBonusPeriod',
              '/api/revenue-bonus',
              'revenueBonusDaily',
              'revenueBonusAllocations',
              'revenueBonusOverrides',
              'loadState',
              'saveState',
              'persistState',
              'mutateState',
              'commitState',
              'compareAndSwap',
              'export default',
          ])
          snippets('server/vps/server.mjs', [
              'createServer',
              'worker.fetch',
              'setInterval',
              'shutdown',
          ], radius=1000)
          snippets('server/vps/sqlite-d1.mjs', [
              'class SqliteD1Database',
              'prepare(',
              'batch(',
              'transaction',
          ], radius=1000)

          text = Path('server/worker.js').read_text(encoding='utf-8')
          print('\n===== FUNCTION/CONST INDEX (state/revenue/command) =====')
          pattern = re.compile(r'(?m)^(?:export\s+)?(?:async\s+)?function\s+([A-Za-z0-9_$]+)|^(?:export\s+)?const\s+([A-Za-z0-9_$]+)\s*=')
          for match in pattern.finditer(text):
              name = match.group(1) or match.group(2)
              if any(token in name.lower() for token in ('state', 'revenue', 'command', 'snapshot', 'persist', 'shared')):
                  line = text.count('\n', 0, match.start()) + 1
                  print(f'{line}: {name}')
          PY

      - name: Remove diagnostic workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/diagnose-revenue-finalizer.yml
          git config user.name 'mrbengilo'
          git config user.email 'mrbengilo.76@gmail.com'
          git add -A
          git commit -m 'chore(ci): remove revenue finalizer diagnostic'
          git push origin HEAD:feat/ops-pages-cached-daily-automation
