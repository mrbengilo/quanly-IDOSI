name: Apply complete navigation performance update

on:
  push:
    branches:
      - perf/navigation-latency-complete
    paths:
      - .github/workflows/apply-complete-navigation-performance.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v6
        with:
          ref: perf/navigation-latency-complete
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply reviewed performance patch
        shell: bash
        env:
          PATCH_SHA256: 9ca34dbfd93f10df7b61605d6eb39c9d8b042fc2e94f291f2be5c60ccc14f8b4
          PATCH_GZIP_BASE64: 
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode > /tmp/navigation-perf.patch.gz
          gzip -dc /tmp/navigation-perf.patch.gz > /tmp/navigation-perf.patch
          echo "$PATCH_SHA256  /tmp/navigation-perf.patch" | sha256sum --check --status
          git apply --check /tmp/navigation-perf.patch
          git apply /tmp/navigation-perf.patch
          git diff --check
          rm -f /tmp/navigation-perf.patch /tmp/navigation-perf.patch.gz

      - name: Remove one-shot workflow from final diff
        run: git rm .github/workflows/apply-complete-navigation-performance.yml

      - name: Install dependencies
        run: npm ci

      - name: Targeted performance regressions
        run: npx vitest run src/services/employeeAvatarCache.test.js src/state/AppContext.activeStore.test.jsx src/layout/AppShell.notifications.test.jsx src/pages/store/StoreTasks.test.jsx server/vps/sqlite-d1.pragmas.test.js server/vps/sqlite-d1.snapshot.test.js server/worker.test.js

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Sites bundle
        run: npm run sites:verify

      - name: Commit verified performance update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mrbengilo'
          git config user.email 'mrbengilo.76@gmail.com'
          git add -A
          git commit -m 'perf(navigation): cache and scope menu data loads'
          git push origin HEAD:perf/navigation-latency-complete
