name: Deliver verified source-level table pagination v5

on:
  push:
    branches:
      - perf/paginate-data-tables-v5
    paths:
      - .github/workflows/deliver-table-pagination-v5.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: idosi-deliver-table-pagination-v5
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: perf/paginate-data-tables-v5
      VERIFY_WORKFLOW: deploy-pages.yml
      DEPLOY_WORKFLOW: deploy-vps.yml
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v6
        with:
          ref: perf/paginate-data-tables-v5
          fetch-depth: 0

      - name: Cancel superseded pagination deliveries and close their pull requests
        shell: bash
        run: |
          set -Eeuo pipefail
          for branch in \
            perf/paginate-data-tables-20260903 \
            perf/paginate-data-tables-v2 \
            perf/paginate-data-tables-v3 \
            perf/paginate-data-tables-v4; do
            encoded_branch="$(node -p "encodeURIComponent(process.argv[1])" "$branch")"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$encoded_branch&per_page=100" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' \
              | while read -r run_id; do
                  [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                done
            gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number' \
              | while read -r pr_number; do
                  [[ -n "$pr_number" ]] && gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
                    --comment 'Đã được thay thế bởi nhánh phân trang v5 đồng bộ từ main mới nhất.' || true
                done
          done

      - name: Synchronize with latest main
        id: base
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement source-level pagination for every application data table
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/components

          # Remove the older DOM-level fallback if a superseded delivery reached main.
          python3 - <<'PY'
          from pathlib import Path
          import re

          shell = Path('src/layout/AppShell.jsx')
          if shell.exists():
              source = shell.read_text(encoding='utf-8')
              source = re.sub(r"^import TablePaginationController from ['\"][^'\"]+['\"]\n", '', source, flags=re.MULTILINE)
              source = re.sub(r'^\s*<TablePaginationController\s*/>\s*\n', '', source, flags=re.MULTILINE)
              shell.write_text(source, encoding='utf-8')

          styles = Path('src/styles.css')
          if styles.exists():
              lines = styles.read_text(encoding='utf-8').splitlines()
              output = []
              skipping = False
              for line in lines:
                  if 'Shared data-table pagination controller' in line:
                      skipping = True
                      continue
                  if skipping:
                      if line.startswith('/*') and 'Shared data-table pagination controller' not in line:
                          skipping = False
                          output.append(line)
                      elif line.strip() and not (
                          line.lstrip().startswith('.workspace-content-region table:not([data-pagination-ready])')
                          or line.lstrip().startswith('.table-pagination--managed')
                          or line.lstrip().startswith('.table-pagination')
                          or line.lstrip().startswith('@media(max-width:640px)')
                      ):
                          skipping = False
                          output.append(line)
                      continue
                  output.append(line)
              styles.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
          PY
          rm -f src/components/TablePaginationController.jsx src/components/TablePaginationController.test.jsx

          cat > src/components/PaginatedTbody.jsx <<'EOF'
          import { Children, Fragment, cloneElement, isValidElement, useEffect, useMemo, useRef, useState } from 'react'

          export const DEFAULT_TABLE_PAGE_SIZE = 20

          const VIETNAM_TIME_ZONE = 'Asia/Ho_Chi_Minh'
          const PAGE_WINDOW = 2

          const vietnamDateKey = (date = new Date()) => {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: VIETNAM_TIME_ZONE,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(date)
            const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]))
            return `${values.year}-${values.month}-${values.day}`
          }

          const previousDateKey = (dateKey) => {
            const [year, month, day] = String(dateKey || '').split('-').map(Number)
            const date = new Date(Date.UTC(year, month - 1, day - 1, 12))
            return [
              date.getUTCFullYear(),
              String(date.getUTCMonth() + 1).padStart(2, '0'),
              String(date.getUTCDate()).padStart(2, '0'),
            ].join('-')
          }

          const flattenChildren = (children) => Children.toArray(children).flatMap((child) => {
            if (typeof child === 'string' && !child.trim()) return []
            if (child === null || child === undefined || typeof child === 'boolean') return []
            if (isValidElement(child) && child.type === Fragment) return flattenChildren(child.props.children)
            return [child]
          })

          const textFromNode = (node) => {
            if (node === null || node === undefined || typeof node === 'boolean') return ''
            if (typeof node === 'string' || typeof node === 'number') return String(node)
            if (Array.isArray(node)) return node.map(textFromNode).join(' ')
            if (!isValidElement(node)) return ''
            const candidates = [
              node.props?.date,
              node.props?.value,
              node.props?.businessDate,
              node.props?.workDate,
              node.props?.createdAt,
              node.props?.updatedAt,
              node.props?.checkInAt,
              node.props?.checkOutAt,
              node.props?.timestamp,
              textFromNode(node.props?.children),
            ].filter(Boolean)
            return candidates.join(' ')
          }

          const normalizeDateKey = (value) => {
            const text = String(value || '').trim()
            let match = text.match(/\b(20\d{2})[-/.](0[1-9]|1[0-2])[-/.]([0-2]\d|3[01])\b/u)
            if (match) return `${match[1]}-${match[2]}-${match[3]}`
            match = text.match(/\b([0-2]\d|3[01])[-/.](0[1-9]|1[0-2])[-/.](20\d{2})\b/u)
            if (match) return `${match[3]}-${match[2]}-${match[1]}`
            return ''
          }

          const rowDateKey = (row) => {
            if (!isValidElement(row)) return ''
            const explicit = row.props?.['data-business-date']
              || row.props?.['data-work-date']
              || row.props?.['data-date']
            return normalizeDateKey(explicit) || normalizeDateKey(textFromNode(row))
          }

          const chunkRows = (rows, pageSize) => {
            const pages = []
            for (let index = 0; index < rows.length; index += pageSize) {
              pages.push(rows.slice(index, index + pageSize))
            }
            return pages
          }

          const buildPages = (rows, mode, pageSize, todayKey) => {
            if (!rows.length) return [[]]
            if (!['today-first', 'today-yesterday-first'].includes(mode)) return chunkRows(rows, pageSize)

            const preferredDates = new Set([todayKey])
            if (mode === 'today-yesterday-first') preferredDates.add(previousDateKey(todayKey))
            const preferred = []
            const historical = []
            rows.forEach((row) => {
              const dateKey = rowDateKey(row)
              if (dateKey && preferredDates.has(dateKey)) preferred.push(row)
              else historical.push(row)
            })

            const pages = chunkRows(preferred, pageSize)
            if (!pages.length) pages.push([])
            pages.push(...chunkRows(historical, pageSize))
            return pages
          }

          const visiblePageNumbers = (currentPage, pageCount) => {
            if (pageCount <= 7) return Array.from({ length: pageCount }, (_, index) => index + 1)
            const values = new Set([1, pageCount])
            for (let page = currentPage - PAGE_WINDOW; page <= currentPage + PAGE_WINDOW; page += 1) {
              if (page > 1 && page < pageCount) values.add(page)
            }
            const sorted = [...values].sort((left, right) => left - right)
            const result = []
            sorted.forEach((page, index) => {
              if (index && page - sorted[index - 1] > 1) result.push(`ellipsis-${page}`)
              result.push(page)
            })
            return result
          }

          const modeForCurrentRoute = (requestedMode) => {
            if (requestedMode) return requestedMode
            if (typeof window === 'undefined') return 'default'
            const route = `${window.location.pathname || ''}${window.location.hash || ''}`.toLocaleLowerCase('en-US')
            if (route.includes('/admin/assignments')) return 'today-yesterday-first'
            if (
              route.includes('/store/orders')
              || route.includes('/store/attendance')
              || route.includes('/store/tasks')
              || route.includes('/store/reward')
              || route.includes('/store/violation')
              || route.includes('/store/work')
            ) return 'today-first'
            return 'default'
          }

          const rowIdentity = (row, index) => {
            if (!isValidElement(row)) return `${index}:${String(row)}`
            return `${String(row.key ?? index)}:${rowDateKey(row)}`
          }

          export default function PaginatedTbody({
            children,
            paginationMode = '',
            pageSize = DEFAULT_TABLE_PAGE_SIZE,
            emptyMessage = '',
            ...tbodyProps
          }) {
            const rows = useMemo(() => flattenChildren(children), [children])
            const normalizedPageSize = Math.max(1, Number(pageSize) || DEFAULT_TABLE_PAGE_SIZE)
            const mode = modeForCurrentRoute(paginationMode)
            const todayKey = vietnamDateKey()
            const rowsSignature = rows.map(rowIdentity).join('|')
            const pages = useMemo(
              () => buildPages(rows, mode, normalizedPageSize, todayKey),
              [mode, normalizedPageSize, rows, rowsSignature, todayKey],
            )
            const [page, setPage] = useState(1)
            const tableBodyRef = useRef(null)
            const pageCount = Math.max(1, pages.length)

            useEffect(() => {
              setPage(1)
            }, [mode, normalizedPageSize, rowsSignature])

            useEffect(() => {
              setPage((current) => Math.min(Math.max(1, current), pageCount))
            }, [pageCount])

            const selectedRows = pages[Math.min(page, pageCount) - 1] || []
            const specialEmpty = !selectedRows.length && rows.length && mode !== 'default'
            const defaultEmptyMessage = mode === 'today-yesterday-first'
              ? 'Không có dữ liệu trong hôm nay và hôm qua.'
              : 'Không có dữ liệu trong ngày hiện tại.'
            const navigate = (nextPage) => {
              setPage(Math.min(pageCount, Math.max(1, nextPage)))
              if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(() => {
                  tableBodyRef.current?.closest('table')?.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' })
                })
              }
            }
            const controls = visiblePageNumbers(page, pageCount)

            return (
              <tbody {...tbodyProps} ref={tableBodyRef} data-source-paginated="true" data-pagination-mode={mode}>
                {selectedRows.map((row, index) => (
                  isValidElement(row) ? cloneElement(row, { key: row.key ?? `page-row-${page}-${index}` }) : row
                ))}
                {specialEmpty ? (
                  <tr className="table-pagination__empty-row">
                    <td colSpan={100}>{emptyMessage || defaultEmptyMessage}</td>
                  </tr>
                ) : null}
                {pageCount > 1 ? (
                  <tr className="table-pagination__row">
                    <td colSpan={100}>
                      <nav className="table-pagination" aria-label="Phân trang bảng dữ liệu">
                        <button type="button" onClick={() => navigate(page - 1)} disabled={page === 1} aria-label="Trang trước">‹</button>
                        {controls.map((value) => (
                          typeof value === 'string'
                            ? <span key={value} className="table-pagination__ellipsis" aria-hidden="true">…</span>
                            : (
                              <button
                                type="button"
                                key={value}
                                className={value === page ? 'active' : ''}
                                aria-current={value === page ? 'page' : undefined}
                                aria-label={`Trang ${value}`}
                                onClick={() => navigate(value)}
                              >
                                {value}
                              </button>
                            )
                        ))}
                        <button type="button" onClick={() => navigate(page + 1)} disabled={page === pageCount} aria-label="Trang sau">›</button>
                        <small>Trang {page}/{pageCount} • tối đa {normalizedPageSize} dòng</small>
                      </nav>
                    </td>
                  </tr>
                ) : null}
              </tbody>
            )
          }

          export const paginationTestHelpers = {
            buildPages,
            flattenChildren,
            modeForCurrentRoute,
            normalizeDateKey,
            previousDateKey,
            rowDateKey,
            vietnamDateKey,
          }
          EOF

          cat > src/components/PaginatedTbody.test.jsx <<'EOF'
          import { cleanup, fireEvent, render, screen, within } from '@testing-library/react'
          import { afterEach, describe, expect, it, vi } from 'vitest'
          import PaginatedTbody from './PaginatedTbody'

          const Table = ({ count = 45, mode = '', dates = [] }) => (
            <table>
              <PaginatedTbody paginationMode={mode}>
                {Array.from({ length: count }, (_, index) => (
                  <tr key={index}>
                    <td>Dòng {index + 1}</td>
                    <td>{dates[index] || '01/01/2026'}</td>
                  </tr>
                ))}
              </PaginatedTbody>
            </table>
          )

          describe('PaginatedTbody', () => {
            afterEach(() => {
              cleanup()
              vi.useRealTimers()
              vi.restoreAllMocks()
              window.history.replaceState({}, '', '/')
              window.location.hash = ''
            })

            it('mounts at most 20 business rows and changes numbered pages', () => {
              render(<Table />)
              const table = screen.getByRole('table')
              expect(within(table).getAllByText(/^Dòng /u)).toHaveLength(20)
              fireEvent.click(screen.getByRole('button', { name: 'Trang 2' }))
              expect(within(table).getAllByText(/^Dòng /u)).toHaveLength(20)
              expect(within(table).getByText('Dòng 21')).toBeTruthy()
              fireEvent.click(screen.getByRole('button', { name: 'Trang 3' }))
              expect(within(table).getAllByText(/^Dòng /u)).toHaveLength(5)
              expect(within(table).getByText('Dòng 45')).toBeTruthy()
            })

            it('keeps today and yesterday on the first assignment-history page', () => {
              vi.useFakeTimers()
              vi.setSystemTime(new Date('2026-09-04T02:00:00.000Z'))
              const dates = [
                ...Array.from({ length: 8 }, () => '04/09/2026'),
                ...Array.from({ length: 8 }, () => '03/09/2026'),
                ...Array.from({ length: 8 }, () => '02/09/2026'),
              ]
              render(<Table count={24} mode="today-yesterday-first" dates={dates} />)
              expect(screen.getAllByText(/^Dòng /u)).toHaveLength(16)
              expect(screen.queryByText('Dòng 17')).toBeNull()
              fireEvent.click(screen.getByRole('button', { name: 'Trang 2' }))
              expect(screen.getAllByText(/^Dòng /u)).toHaveLength(8)
              expect(screen.getByText('Dòng 17')).toBeTruthy()
            })

            it('keeps the current business date on the first store page', () => {
              vi.useFakeTimers()
              vi.setSystemTime(new Date('2026-09-04T02:00:00.000Z'))
              const dates = [
                ...Array.from({ length: 5 }, () => '04/09/2026'),
                ...Array.from({ length: 20 }, () => '03/09/2026'),
              ]
              render(<Table count={25} mode="today-first" dates={dates} />)
              expect(screen.getAllByText(/^Dòng /u)).toHaveLength(5)
              fireEvent.click(screen.getByRole('button', { name: 'Trang 2' }))
              expect(screen.getAllByText(/^Dòng /u)).toHaveLength(20)
            })

            it('infers the current-date mode for store orders from the hash route', () => {
              vi.useFakeTimers()
              vi.setSystemTime(new Date('2026-09-04T02:00:00.000Z'))
              window.location.hash = '#/store/orders'
              render(<Table count={21} dates={[
                '04/09/2026',
                ...Array.from({ length: 20 }, () => '03/09/2026'),
              ]} />)
              expect(screen.getAllByText(/^Dòng /u)).toHaveLength(1)
              expect(screen.getByText('Dòng 1')).toBeTruthy()
            })
          })
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import unicodedata

          root = Path('src')
          component = root / 'components' / 'PaginatedTbody.jsx'

          def normalized(value):
              text = unicodedata.normalize('NFD', value.casefold())
              return ''.join(char for char in text if unicodedata.category(char) != 'Mn').replace('đ', 'd')

          mode_labels = [
              ('lich su giao viec va tien do hoan thanh', 'today-yesterday-first'),
              ('lich su cham cong cua nhan vien', 'today-first'),
              ('lich su cham cong nhan vien', 'today-first'),
              ('cong viec tinh thuong & vi pham', 'today-first'),
              ('cong viec tinh thuong va vi pham', 'today-first'),
          ]
          source_files = 0
          body_count = 0
          explicit_modes = {}

          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in {'.jsx', '.tsx'}:
                  continue
              if path == component or '.test.' in path.name or '.spec.' in path.name:
                  continue
              source = path.read_text(encoding='utf-8')
              raw_openings = list(re.finditer(r'<tbody(?=[\s>])', source))
              raw_closings = len(re.findall(r'</tbody\s*>', source))
              if len(raw_openings) != raw_closings:
                  raise SystemExit(f'Unbalanced tbody tags in {path}: {len(raw_openings)} open / {raw_closings} close')

              updated = source
              if raw_openings:
                  normalized_source = normalized(source)
                  replacements = []
                  for match in raw_openings:
                      start = match.start()
                      nearby = normalized_source[max(0, start - 9000):min(len(normalized_source), start + 9000)]
                      mode = next((candidate for label, candidate in mode_labels if label in nearby), '')
                      replacement = '<PaginatedTbody'
                      if mode:
                          replacement += f' paginationMode="{mode}"'
                          explicit_modes[mode] = explicit_modes.get(mode, 0) + 1
                      replacements.append((match.start(), match.end(), replacement))
                  for start, end, replacement in reversed(replacements):
                      updated = updated[:start] + replacement + updated[end:]
                  updated = re.sub(r'</tbody\s*>', '</PaginatedTbody>', updated)

              if '<PaginatedTbody' not in updated:
                  continue

              relative_import = os.path.relpath(component.with_suffix(''), path.parent).replace(os.sep, '/')
              if not relative_import.startswith('.'):
                  relative_import = f'./{relative_import}'
              import_line = f"import PaginatedTbody from '{relative_import}'"
              if import_line not in updated:
                  existing_import = re.search(r"^import PaginatedTbody from ['\"][^'\"]+['\"]\s*$", updated, flags=re.MULTILINE)
                  if existing_import:
                      updated = updated[:existing_import.start()] + import_line + updated[existing_import.end():]
                  else:
                      first_import = re.search(r'^import\s', updated, flags=re.MULTILINE)
                      if first_import:
                          updated = updated[:first_import.start()] + import_line + '\n' + updated[first_import.start():]
                      else:
                          updated = import_line + '\n' + updated

              if updated != source:
                  path.write_text(updated, encoding='utf-8')
              source_files += 1
              body_count += updated.count('<PaginatedTbody')

          if source_files < 8 or body_count < 12:
              raise SystemExit(f'Pagination coverage unexpectedly low: {source_files} files / {body_count} bodies')
          print({
              'paginated_source_files': source_files,
              'paginated_table_bodies': body_count,
              'explicit_modes': explicit_modes,
          })
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          source = path.read_text(encoding='utf-8')
          marker = '/* Shared source-level data-table pagination */'
          if marker not in source:
              source = source.rstrip() + '''

          /* Shared source-level data-table pagination */
          .table-pagination__row>td{padding:14px 10px!important;background:#fbfdfb!important;border-top:1px solid #dbe8df!important;text-align:center!important}
          .table-pagination{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%}
          .table-pagination button{min-width:34px;height:34px;padding:0 9px;border:1px solid #cadbd0;border-radius:8px;background:#fff;color:#155d38;font-size:12px;font-weight:750;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
          .table-pagination button:hover:not(:disabled){border-color:#4ba873;background:#edf8f1;transform:translateY(-1px)}
          .table-pagination button.active{border-color:#078443;background:#078443;color:#fff;box-shadow:0 5px 14px rgba(7,132,67,.2)}
          .table-pagination button:disabled{cursor:not-allowed;opacity:.4}
          .table-pagination small{margin-left:8px;color:#65736b;font-size:10px;font-weight:600}
          .table-pagination__ellipsis{display:inline-grid;place-items:center;min-width:24px;color:#718078;font-weight:800}
          .table-pagination__empty-row>td{padding:22px!important;color:#738078!important;text-align:center!important;background:#fbfdfb!important;font-size:12px!important}
          @media(max-width:640px){.table-pagination{gap:4px}.table-pagination button{min-width:31px;height:31px;padding:0 7px}.table-pagination small{flex-basis:100%;margin:4px 0 0}}
          '''.strip('\n') + '\n'
              path.write_text(source, encoding='utf-8')
          PY

          rm -f .github/workflows/deliver-table-pagination-v5.yml

      - name: Verify source coverage before tests
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          raw = []
          converted = []
          bodies = 0
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.jsx', '.tsx'} or '.test.' in path.name or '.spec.' in path.name:
                  continue
              text = path.read_text(encoding='utf-8')
              if path.name != 'PaginatedTbody.jsx' and '<tbody' in text:
                  raw.append(str(path))
              if path.name != 'PaginatedTbody.jsx' and '<PaginatedTbody' in text:
                  converted.append(str(path))
                  bodies += text.count('<PaginatedTbody')
          if raw:
              raise SystemExit(f'Unconverted tbody tags: {raw}')
          if len(converted) < 8 or bodies < 12:
              raise SystemExit(f'Insufficient pagination coverage: {len(converted)} files / {bodies} bodies')
          print({'paginated_source_files': len(converted), 'paginated_table_bodies': bodies})
          PY

      - name: Targeted pagination tests
        run: npx vitest run src/components/PaginatedTbody.test.jsx

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Sites bundle
        run: npm run sites:verify

      - name: Refuse a stale candidate if main changed during verification
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" != "$BASE_SHA" ]]; then
            echo "main changed during verification: base=$BASE_SHA current=$current" >&2
            exit 75
          fi

      - name: Commit and push verified candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mrbengilo'
          git config user.email 'mrbengilo.76@gmail.com'
          git add -A
          git commit -m 'perf(tables): paginate all data lists at 20 rows'
          git push --force-with-lease origin HEAD:"$BRANCH_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pull_request
        shell: bash
        run: |
          set -Eeuo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH_NAME" \
              --title 'perf: phân trang toàn bộ bảng dữ liệu tối đa 20 dòng' \
              --body '## Phạm vi
          - Admin/Giao việc: trang đầu ưu tiên hôm nay và hôm qua.
          - Cửa hàng/Đơn hàng: trang đầu ưu tiên ngày hiện tại.
          - Cửa hàng/Công việc tính thưởng & vi phạm: trang đầu ưu tiên ngày hiện tại.
          - Cửa hàng/Chấm công: trang đầu ưu tiên ngày hiện tại.
          - Mọi bảng dữ liệu còn lại: tối đa 20 dòng/trang, có số trang 1,2,3… và nút trước/sau.

          ## Hiệu năng
          Chỉ tối đa 20 dòng của mỗi tbody được mount vào DOM tại một thời điểm; chuyển trang mới mount nhóm tiếp theo.

          ## Kiểm thử
          Targeted pagination tests, lint, full test suite, production build và Sites verification đã đạt trước khi mở PR.

          ## An toàn
          Không migration, không xóa dữ liệu và không thay đổi công thức tài chính.')"
            existing="${url##*/}"
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for official pull-request candidate verification
        id: pr_verify
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          grep -q 'workflow_dispatch' ".github/workflows/$VERIFY_WORKFLOW" || {
            echo "Verify workflow does not support workflow_dispatch." >&2
            exit 1
          }
          gh workflow run "$VERIFY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH_NAME"
          for attempt in $(seq 1 240); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$VERIFY_WORKFLOW" --branch "$BRANCH_NAME" \
              --event workflow_dispatch --limit 20 --json status,conclusion,databaseId,headSha \
              --jq ".[] | select(.headSha == \"$CANDIDATE_SHA\") | [.status, (.conclusion // \"\"), (.databaseId|tostring)] | @tsv" \
              | head -n 1)"
            status="$(cut -f1 <<<"$row")"
            conclusion="$(cut -f2 <<<"$row")"
            run_id="$(cut -f3 <<<"$row")"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo "Official Verify IDOSI failed: run=$run_id conclusion=$conclusion" >&2; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for official candidate verification.' >&2
          exit 1

      - name: Merge verified pull request
        id: merge
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
        run: |
          set -Eeuo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
            --subject 'perf(tables): paginate data lists at 20 rows' \
            --body 'Mount at most 20 rows per data table and prioritize current business dates on the requested high-volume history screens.'
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for official main verification
        id: main_verify
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -Eeuo pipefail
          gh workflow run "$VERIFY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 1 240); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$VERIFY_WORKFLOW" --branch main \
              --event workflow_dispatch --limit 20 --json status,conclusion,databaseId,headSha \
              --jq ".[] | select(.headSha == \"$MERGE_SHA\") | [.status, (.conclusion // \"\"), (.databaseId|tostring)] | @tsv" \
              | head -n 1)"
            status="$(cut -f1 <<<"$row")"
            conclusion="$(cut -f2 <<<"$row")"
            run_id="$(cut -f3 <<<"$row")"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo "Official main Verify IDOSI failed: run=$run_id conclusion=$conclusion" >&2; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for official main verification.' >&2
          exit 1

      - name: Wait for automatic deployment or dispatch it explicitly
        id: deploy
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -Eeuo pipefail
          dispatched=0
          for attempt in $(seq 1 300); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$DEPLOY_WORKFLOW" --commit "$MERGE_SHA" \
              --limit 20 --json status,conclusion,databaseId \
              --jq '.[0] | [.status, (.conclusion // ""), (.databaseId|tostring)] | @tsv' 2>/dev/null || true)"
            status="$(cut -f1 <<<"$row")"
            conclusion="$(cut -f2 <<<"$row")"
            run_id="$(cut -f3 <<<"$row")"
            if [[ "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo "Deploy IDOSI VPS failed: run=$run_id conclusion=$conclusion" >&2; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$status" && "$attempt" -eq 12 && "$dispatched" -eq 0 ]]; then
              if grep -q 'workflow_dispatch' ".github/workflows/$DEPLOY_WORKFLOW"; then
                gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main -f release_sha="$MERGE_SHA" || true
                dispatched=1
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for VPS deployment.' >&2
          exit 1

      - name: Verify exact public production release
        id: production
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            payload="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://idosi.io.vn/api/release?_pagination_v5=$attempt" 2>/dev/null || true)"
            actual="$(node -e "const p=process.argv[1];try{const v=JSON.parse(p);process.stdout.write(v.data?.releaseSha||v.releaseSha||'')}catch{}" "$payload")"
            if [[ "$actual" == "$MERGE_SHA" ]]; then
              curl -fsS --max-time 20 "https://idosi.io.vn/api/health?_pagination_v5=$attempt" >/dev/null
              curl -fsS --max-time 20 "https://idosi.io.vn/?_pagination_v5=$attempt" >/dev/null
              echo "sha=$actual" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Production did not reach exact merge SHA $MERGE_SHA" >&2
          exit 1

      - name: Publish production completion marker on delivery branch
        if: success()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          PR_VERIFY_RUN: ${{ steps.pr_verify.outputs.run_id }}
          MAIN_VERIFY_RUN: ${{ steps.main_verify.outputs.run_id }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH_NAME"
          git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          cat > PAGINATION_PRODUCTION_PASS.json <<JSON
          {
            "status": "PASS",
            "pullRequest": $PR_NUMBER,
            "releaseSha": "$MERGE_SHA",
            "candidateVerifyRun": "$PR_VERIFY_RUN",
            "mainVerifyRun": "$MAIN_VERIFY_RUN",
            "deployRun": "$DEPLOY_RUN",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "production": "https://idosi.io.vn"
          }
          JSON
          git add PAGINATION_PRODUCTION_PASS.json
          git commit -m 'ops: record pagination production verification'
          git push origin HEAD:"$BRANCH_NAME"

      - name: Close any superseded pagination pull requests again
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for branch in \
            perf/paginate-data-tables-20260903 \
            perf/paginate-data-tables-v2 \
            perf/paginate-data-tables-v3 \
            perf/paginate-data-tables-v4; do
            gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number' \
              | while read -r pr_number; do
                  [[ -n "$pr_number" ]] && gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
                    --comment 'Đã được thay thế bởi bản phân trang v5 đã kiểm thử và triển khai production.' || true
                done
          done
