name: Multi-shift regression workspace

on:
  push:
    branches: [fix/multi-shift-attendance-20260922]
    paths: [.github/workflows/multi-shift-test-workspace.yml]

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply exact locally tested patch
        env:
          PATCH_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, zlib, hashlib, pathlib, subprocess
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest() == 'c6229442e04008ea611283bc3136a65dc9cceb45ddb00eaab947f27717d1c394', 'Patch digest mismatch'
          path = pathlib.Path('/tmp/multi-shift.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - name: Verify affected workflows
        run: npx vitest run server/worker.test.js src/domain/supportScheduling.test.js src/state/AppContext.scheduleFallback.test.jsx src/pages/store/UnifiedSchedule.layout.test.jsx src/pages/employee/EmployeeV2Pages.test.js --maxWorkers=1 -t 'shared support workflow|local schedule fallback|store schedule visual flow|next-shift|support scheduling'
      - name: Commit tested fix to task branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/worker.js server/worker.test.js src/domain/supportScheduling.js src/pages/employee/EmployeeV2Pages.test.js src/pages/store/UnifiedSchedule.layout.test.jsx src/state/AppContext.scheduleFallback.test.jsx
          git diff --cached --check
          git commit -m 'fix: append same-day employee shifts without replacing attended assignments'
          git push origin HEAD:refs/heads/fix/multi-shift-attendance-20260922
          git rev-parse HEAD
