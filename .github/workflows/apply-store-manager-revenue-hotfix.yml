name: Apply Store Manager Revenue Hotfix

on:
  push:
    branches:
      - fix/store-manager-revenue-bonus-action
    paths:
      - .github/workflows/apply-store-manager-revenue-hotfix.yml

permissions:
  contents: write

concurrency:
  group: apply-store-manager-revenue-hotfix
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.repository == 'mrbengilo/quanly-IDOSI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: baee193d7d584318b62a52ba168d491f8e099444
      BOOTSTRAP_BRANCH: fix/store-manager-revenue-bonus-action
      VERIFIED_BRANCH: fix/store-manager-revenue-bonus-action-verified
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BOOTSTRAP_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Restore exact main base and apply reviewed patch
        run: |
          set -Eeuo pipefail
          cp scripts/store-manager-revenue-bonus-action.patch.gz.b64 /tmp/hotfix.patch.gz.b64
          base64 --decode /tmp/hotfix.patch.gz.b64 | gzip --decompress > /tmp/hotfix.patch
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git apply --check /tmp/hotfix.patch
          git apply /tmp/hotfix.patch
          git diff --check

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused revenue and authorization tests
        run: |
          set -Eeuo pipefail
          npx vitest run --maxWorkers=1 \
            server/revenueBonusCutoff.test.js \
            server/worker.test.js \
            src/pages/compensation/CompensationPages.test.jsx \
            src/pages/compensation/RevenueBonusCutoff.test.jsx \
            src/pages/compensation/RevenueBonusStoreManager.test.jsx \
            src/state/AppContext.staffPermissions.test.js

      - name: Run full pre-commit quality gate
        run: |
          set -Eeuo pipefail
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test
          npm run build
          npm run sites:verify

      - name: Commit only verified source and tests
        run: |
          set -Eeuo pipefail
          git config user.name "IDOSI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            server/worker.js \
            server/worker.test.js \
            src/pages/compensation/CompensationPages.test.jsx \
            src/pages/compensation/RevenueBonusPage.jsx \
            src/pages/compensation/RevenueBonusStoreManager.test.jsx \
            src/state/AppContext.jsx \
            src/state/AppContext.staffPermissions.test.js
          test -n "$(git diff --cached --name-only)"
          test -z "$(git status --porcelain | grep -vE '^[AM]  ' || true)"
          git commit -m "fix(revenue): show scoped calculation action to store managers"

      - name: Publish verified branch without force
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --heads origin "$VERIFIED_BRANCH" >/dev/null 2>&1; then
            echo "Verified branch already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$VERIFIED_BRANCH"
