name: Inspect navigation performance anchors

on:
  push:
    branches:
      - perf/eliminate-navigation-event-loop-blocking
    paths:
      - .github/workflows/inspect-navigation-performance-anchors.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Print exact source anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def print_block(path, needle, before=40, after=180):
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              indexes = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {path} :: {needle} :: matches={len(indexes)} =====')
              for index in indexes:
                  start = max(0, index - before)
                  end = min(len(lines), index + after + 1)
                  print(f'--- lines {start + 1}-{end} ---')
                  for line_no in range(start, end):
                      print(f'{line_no + 1:06d}: {lines[line_no]}')

          print_block('server/worker.js', 'const loadStateCollections = async', 20, 180)
          print_block('server/worker.js', 'const migrateLegacyAccountAvatars = async', 30, 220)
          print_block('server/worker.js', 'const getEmployeeAccountAvatar = async', 100, 220)
          print_block('server/worker.js', 'const getIdentityImage = async', 40, 180)
          print_block('server/vps/sqlite-d1.mjs', 'constructor(', 30, 100)
          print_block('src/services/employeeAvatarCache.js', 'const avatarCache', 10, 260)
          print_block('server/worker.test.js', 'EMPLOYEE_AVATAR_NOT_FOUND', 100, 180)
          PY
