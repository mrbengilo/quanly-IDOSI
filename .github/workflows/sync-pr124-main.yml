name: Sync PR 124 with main

on:
  push:
    branches:
      - feat/automatic-live-revenue-bonus
    paths:
      - .github/workflows/sync-pr124-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/automatic-live-revenue-bonus
          fetch-depth: 0

      - name: Merge current main into feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit --no-ff origin/main
          git rm .github/workflows/sync-pr124-main.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/automatic-live-revenue-bonus
